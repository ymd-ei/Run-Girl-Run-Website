<!DOCTYPE html>
<html lang="en">
<head>

<script>
  if (!/desktop=true/.test(location.search)) {
    if (!sessionStorage.getItem('forceDesktop')) {
      if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.maxTouchPoints > 0) {
        location.replace('mobile.html');
      }
    }
  } else {
    sessionStorage.setItem('forceDesktop', '1');
  }
</script>
<title>Portfolio</title>

<meta property="og:type" content="website">

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;cursor:none !important}
  :root{
    --ink:#1a1714;--paper:#f2ede4;--accent:#5e30eb;--accent-rgb:94,48,235;
    --font-s:'Cormorant Garamond',serif;--font-b:'DM Sans',sans-serif;
  }
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:var(--font-b);font-weight:300;background:var(--ink);color:var(--paper)}

  #stage{position:fixed;inset:0;z-index:0;background:var(--ink);overflow:hidden}
  #reel{position:absolute;inset:0;overflow:hidden}
  #reel iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:177.78vh;height:100vh;min-width:100%;min-height:56.25vw;border:none}
  #reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:none}

  #nav{position:fixed;z-index:100;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:1.5rem 2.5rem;pointer-events:none}
  .nl,.nls{opacity:0}

  #ht{position:fixed;z-index:10;bottom:3rem;left:2.5rem;pointer-events:none}
  .hname{font-family:var(--font-s);font-size:clamp(4rem,8vw,9rem);font-weight:700;line-height:.88}
  #watch-reel-wrap{position:fixed;z-index:10;top:66.666%;left:0;right:0;display:flex;justify-content:center;transform:translateY(-50%);opacity:0}

  #loader{position:fixed;inset:0;z-index:1000;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;opacity:1;transition:opacity .55s ease}
  #loader-img{width:min(120px,25vw);height:auto;margin-bottom:.25rem}
  #loader-name{font-family:var(--font-s);font-size:1.1rem;letter-spacing:.35em;color:var(--paper)}
  #loader-bar-wrap{width:min(300px,70vw);height:1px;background:rgba(242,237,228,0.22);overflow:hidden}
  #loader-bar{height:100%;width:0;background:var(--accent)}
  #loader.done{pointer-events:none;opacity:0}
</style>
<style id="theme-vars"></style>
<style id="pattern-styles"></style>
</head>
<body>
<div id="cur"></div>
<div id="grain"></div>

<!-- LOADER -->
<div id="loader">
  <img id="loader-img" src="images/doog_loop.png" alt="">
  <div id="loader-name"></div>
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
</div>

<div id="stage"><div id="reel"></div></div>

<nav id="nav">
  <a href="#" class="nl" id="nav-name" onclick="return false;"></a>
  <ul class="nls">
    <li><button onclick="window.display?.openPanel?.('work')">Work</button></li>
    <li><button onclick="window.display?.openPanel?.('about')">About</button></li>
    <li><button onclick="window.display?.openPanel?.('contact')">Contact</button></li>
  </ul>
</nav>

<div id="ht">
  <p class="htag" id="hero-role"></p>
  <h1 class="hname" id="hero-name"></h1>
</div>
<div id="log-stack"><div id="ls-inner" class="ls-inner"></div></div>
<div id="sh"><div class="avail-dot"></div><span class="avail-text">Available for work</span></div>

<div id="watch-reel-wrap">
  <button id="watch-reel" onclick="window.display?.openLightbox?.()">
    <span class="wr-play"><span class="wr-tri"></span></span>
    Watch Reel
  </button>
</div>

<div id="lightbox">
  <div id="lb-backdrop" onclick="window.display?.closeLightbox?.()"></div>
  <div id="lb-inner">
    <div id="lb-top">
      <span id="lb-label">Demo Reel</span>
      <button id="lb-close" onclick="window.display?.closeLightbox?.()">&#x2715;</button>
    </div>
    <div id="lb-frame"></div>
  </div>
</div>

<div id="bd" onclick="window.display?.smartClose?.()"></div>

<!-- WORK -->
<div class="panel wide" id="panel-work">
  <div class="ph"><span class="pt2">Work</span><button class="pc" onclick="window.display?.closeToRoot?.()">&#x2715;</button></div>
  <div class="pb">
    <div class="wf" id="work-filters"></div>
    <div class="wg" id="wg"></div>
  </div>
</div>

<!-- PROJECT DETAIL -->
<div class="panel" id="pp">
  <div class="ph">
    <button class="backbtn" onclick="window.display?.closeProject?.()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      Back
    </button>
    <button class="pc" onclick="window.display?.closeProject?.()">&#x2715;</button>
  </div>
  <div class="ppbody" id="ppb"></div>
</div>

<!-- ABOUT -->
<div class="panel" id="panel-about">
  <div class="ph"><span class="pt2">About</span><button class="pc" onclick="window.display?.closeToRoot?.()">&#x2715;</button></div>
  <div class="pb" id="about-body"></div>
</div>

<!-- CONTACT PANEL & CLOSE BUTTON -->
<div id="ct-sliver" onclick="window.display?.closeToRoot?.()"></div>
<button id="ct-close" onclick="window.display?.closeToRoot?.()">&#x2715;</button>

<div id="contact-wrapper">
  <div id="ct-bg">
    <div id="ct-bg-video"></div>
    <div id="ct-bg-grad"></div>
    <div id="ct-bg-dark"></div>
    <div id="ct-bg-grain"></div>
  </div>
  <div id="ct-content">
    <div id="ct-splash">
      <div class="ct-ticker tape-top reverse" id="ct-ticker-top">
        <div class="ticker-track"></div>
      </div>
      <p class="ct-tag" id="ct-location"></p>
      <h1 class="ct-hero"></h1>
      <p class="ct-sub"></p>
      <div class="ct-scroll-cue"><span class="ct-scroll-line"></span>See how to reach us</div>
    </div>
    <div id="ct-ticker-mid" class="ct-ticker tape-mid">
      <div class="ticker-track"></div>
    </div>
    <div id="ct-links">
      <div class="ct-email-block">
        <p class="ct-email-label"></p>
        <a id="ct-email-link" href="#" class="ct-email-link">
          <span id="ct-email-text"></span>
          <i class="ph-fill ph-arrow-up-right arr"></i>
        </a>
      </div>
      <div id="ct-social-wrap">
        <p class="ct-social-label"></p>
        <div class="ct-icons" id="ct-icons"></div>
      </div>
      <div class="ct-resume-block" id="ct-resume-wrap" style="display:none">
        <p class="ct-email-label">Credentials</p>
        <a id="ct-resume-link" href="#" target="_blank" rel="noopener" class="ct-resume-link">
          <i class="ph-fill ph-file-pdf"></i>
          View Resume
          <i class="ph-fill ph-arrow-right"></i>
        </a>
      </div>
    </div>
    <div class="ct-footer">
      <span id="ct-footer-name"></span>
      <div class="ct-footer-dot"></div>
      <span id="ct-footer-loc"></span>
    </div>
  </div>
</div>

<div id="contact-wrapper-bg"></div>

<!-- Vimeo API (optional, for Vimeo player support) -->
<script src="https://player.vimeo.com/api/player.js" defer></script>

<script type="module">
  import('./src/display/main.js?v=3')
    .then(({ bootstrap }) => {
      const start = () => {
        bootstrap().catch(err => {
          console.error('Failed to bootstrap display:', err);
          document.body.innerHTML += '<p style="padding: 2rem; color: red;">Error loading portfolio: ' + err.message + '</p>';
        });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start, { once: true });
      } else {
        start();
      }
    })
    .catch(err => {
      console.error('Failed to load display module:', err);
      document.body.innerHTML += '<p style="padding: 2rem; color: red;">Error loading portfolio module: ' + err.message + '</p>';
    });
</script>
</body>
</html>
