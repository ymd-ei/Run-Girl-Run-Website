<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;cursor:none !important}
:root{
  --ink:#1a1714;--paper:#f2ede4;--surface:#ede8df;--accent:#71904c;
  --muted:rgba(26,23,20,0.4);--border:rgba(26,23,20,0.12);
  --panel-bg:#f7f3ec;--panel-border:rgba(26,23,20,0.1);
  --font-s:'Cormorant Garamond',serif;--font-b:'DM Sans',sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--font-b);font-weight:300;background:var(--ink);color:var(--paper)}

#cur{position:fixed;z-index:9999;width:10px;height:10px;background:var(--accent);border:1.5px solid var(--accent);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);transition:width .28s var(--ease),height .28s var(--ease),background .28s var(--ease),border-width .28s var(--ease),opacity .2s}
body.ch #cur{width:40px;height:40px;background:transparent;border-width:1px}

#stage{position:fixed;inset:0;z-index:0;background:var(--ink);overflow:hidden}
#stage::after{content:'';position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse 60% 50% at 50% 100%,rgba(113,144,76,0.06) 0%,transparent 70%),linear-gradient(to top,rgba(26,23,20,0.78) 0%,rgba(26,23,20,0.05) 50%,rgba(26,23,20,0.52) 100%);pointer-events:none}
#reel{position:absolute;inset:0;overflow:hidden}
#reel iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:177.78vh;height:100vh;min-width:100%;min-height:56.25vw;border:none}
#reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:none}
#reel-block{position:absolute;inset:0;z-index:1;pointer-events:all;background:transparent}
#rp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pg{position:absolute;inset:0;background-image:linear-gradient(rgba(242,237,228,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,228,0.03) 1px,transparent 1px);background-size:60px 60px}
.pi{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.bp{width:80px;height:80px;border:1px solid rgba(242,237,228,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:border-color .25s,transform .25s}
.bp:hover{border-color:var(--accent);transform:scale(1.06)}
.bpt{width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:21px solid rgba(242,237,228,0.55);margin-left:5px}
.bp:hover .bpt{border-left-color:var(--accent)}
.pl{font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,237,228,0.22)}

#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px}

#nav{position:fixed;z-index:100;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:1.5rem 2.5rem;pointer-events:none}
.nl{font-family:var(--font-s);font-size:1.3rem;font-weight:400;letter-spacing:.06em;color:var(--paper);text-decoration:none;pointer-events:all;opacity:0;animation:fdn .8s .4s var(--ease) forwards}
.nls{display:flex;gap:.25rem;list-style:none;pointer-events:all;opacity:0;animation:fdn .8s .6s var(--ease) forwards}
.nls button{font-family:var(--font-b);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;background:none;border:none;color:rgba(242,237,228,0.45);padding:.5rem 1rem;transition:color .2s;position:relative}
.nls button::after{content:'';position:absolute;bottom:2px;left:1rem;right:1rem;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .28s var(--ease)}
.nls button:hover,.nls button.active{color:var(--paper)}
.nls button:hover::after,.nls button.active::after{transform:scaleX(1)}

#ht{position:fixed;z-index:10;bottom:3rem;left:2.5rem;pointer-events:none}
.htag{font-family:var(--font-b);font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:.9rem;font-weight:500;opacity:1}
.hname{font-family:var(--font-s);font-size:clamp(4rem,8vw,9rem);font-weight:700;line-height:.88;letter-spacing:.01em;opacity:1}
.sc-char{display:inline;opacity:0;transition:opacity .08s}
.hname em{color:var(--accent);font-style:italic;display:block}
#sh{position:fixed;z-index:10;bottom:3rem;right:2.5rem;display:flex;align-items:center;gap:.65rem;pointer-events:none;opacity:0;animation:fup .8s 1.1s var(--ease) forwards}
#log-stack{position:fixed;z-index:10;bottom:5.5rem;right:2.5rem;display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;pointer-events:none;max-width:240px}
.ls-entry{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,237,228,0.9);line-height:1.5;text-align:right;opacity:0;transform:translateY(6px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.ls-entry.show{transform:translateY(0)}
.avail-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:pulse 2.4s ease-in-out infinite}
.avail-text{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,237,228,0.45)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}

#watch-reel-wrap{position:fixed;z-index:10;top:66.666%;left:0;right:0;display:flex;justify-content:center;transform:translateY(-50%);opacity:0;animation:fup .8s 1s var(--ease) forwards}
@keyframes fop{from{opacity:0}to{opacity:1}}
#watch-reel{display:flex;align-items:center;justify-content:center;gap:.75rem;background:none;border:1px solid rgba(242,237,228,0.3);color:var(--paper);font-family:var(--font-b);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;padding:.7rem 1.5rem;transition:border-color .25s,background .25s}
#watch-reel:hover{border-color:var(--accent);background:rgba(113,144,76,0.12)}
.wr-play{width:22px;height:22px;border:1px solid rgba(242,237,228,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .25s}
#watch-reel:hover .wr-play{border-color:var(--accent)}
.wr-tri{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:9px solid rgba(242,237,228,0.7);margin-left:2px}

#lightbox{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease}
#lightbox.open{opacity:1;pointer-events:all}
#lb-backdrop{position:absolute;inset:0;background:rgba(10,8,6,0.88);backdrop-filter:blur(8px)}
#lb-inner{position:relative;z-index:1;width:min(900px,92vw);display:flex;flex-direction:column;gap:1rem;transform:translateY(20px);transition:transform .45s var(--ease)}
#lightbox.open #lb-inner{transform:translateY(0)}
#lb-frame{width:100%;aspect-ratio:16/9;background:#000}
#lb-frame iframe{width:100%;height:100%;border:none;display:block;cursor:auto !important}
#lb-top{display:flex;align-items:center;justify-content:space-between}
#lb-label{font-family:var(--font-b);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,237,228,0.4)}
#lb-close{width:32px;height:32px;border:1px solid rgba(242,237,228,0.2);background:none;color:rgba(242,237,228,0.5);font-size:.8rem;line-height:1;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,transform .25s}
#lb-close:hover{border-color:var(--accent);color:var(--paper);transform:rotate(90deg)}

#bd{position:fixed;inset:0;z-index:200;background:rgba(26,23,20,0.45);opacity:0;pointer-events:none;transition:opacity .4s ease}
#bd.open{opacity:1;pointer-events:all}

.panel{position:fixed;z-index:300;top:0;right:0;bottom:0;width:min(540px,92vw);background:rgba(247,243,236,0.97);backdrop-filter:blur(12px);border-left:1px solid var(--panel-border);transform:translateX(110%);transition:transform .6s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.panel.wide{width:min(740px,96vw)}
.panel.open{transform:translateX(0)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:1.75rem 2rem 1.25rem;border-bottom:1px solid var(--panel-border);flex-shrink:0}
.pt2{font-family:var(--font-s);font-size:2.2rem;font-weight:400;letter-spacing:.04em;color:var(--ink)}
.pc{width:34px;height:34px;border:1px solid var(--border);background:none;color:rgba(26,23,20,0.4);font-size:.85rem;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .2s,color .2s,width .28s var(--ease),height .28s var(--ease),transform .25s}
.pc:hover{border-color:transparent;color:var(--accent);width:24px;height:24px;transform:rotate(90deg)}
.pb{flex:1;overflow-y:auto;padding:2rem;scrollbar-width:thin;scrollbar-color:rgba(26,23,20,0.1) transparent;color:var(--ink)}
.pb::-webkit-scrollbar{width:3px}.pb::-webkit-scrollbar-thumb{background:rgba(26,23,20,0.1)}
.panel.open .pb>*{opacity:0;animation:fup .5s var(--ease) forwards}
.panel.open .pb>*:nth-child(1){animation-delay:.08s}.panel.open .pb>*:nth-child(2){animation-delay:.15s}.panel.open .pb>*:nth-child(3){animation-delay:.21s}.panel.open .pb>*:nth-child(4){animation-delay:.27s}.panel.open .pb>*:nth-child(5){animation-delay:.32s}.panel.open .pb>*:nth-child(6){animation-delay:.37s}

/* WORK GRID */
.wf{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.75rem}
.fb{font-family:var(--font-b);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--border);background:transparent;color:var(--muted);padding:.38rem .9rem;transition:all .2s}
.fb.active,.fb:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.wc{transition:opacity .3s}
.wci{aspect-ratio:4/3;background:var(--surface);position:relative;overflow:hidden;margin-bottom:.65rem;transition:transform .35s var(--ease)}
.wc:hover .wci{transform:scale(1.025)}
.wci img{width:100%;height:100%;object-fit:cover;display:block}
.wco{position:absolute;inset:0;background:rgba(113,144,76,0.88);display:flex;align-items:center;justify-content:center;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--paper);opacity:0;transition:opacity .25s}
.wc:hover .wco{opacity:1}
.wcm{display:flex;justify-content:space-between;align-items:baseline}
.wct{font-size:.85rem;font-weight:500;color:var(--ink)}
.wcty{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.tph svg{width:100%;height:100%}

/* PROJECT PANEL */
#pp{z-index:400;width:min(680px,96vw);background:var(--panel-bg);border-left:1px solid var(--panel-border)}
.ppbody{flex:1;overflow-y:auto;padding:2rem;scrollbar-width:thin;color:var(--ink)}
.ppbody::-webkit-scrollbar{width:3px}.ppbody::-webkit-scrollbar-thumb{background:rgba(26,23,20,0.08)}
.backbtn{display:flex;align-items:center;gap:.6rem;border:none;background:none;color:var(--muted);font-family:var(--font-b);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;transition:color .2s;padding:0;margin-right:auto}
.backbtn:hover{color:var(--ink)}

/* BLOCK RENDERER */
.block-canvas{display:flex;flex-direction:column;gap:1.25rem}
.bl-text-sm{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.6}
.bl-text-md{font-size:.95rem;color:rgba(26,23,20,0.7);line-height:1.85}
.bl-text-lg{font-family:var(--font-s);font-size:2rem;font-weight:400;color:var(--ink);line-height:1.1}
.bl-text-sm.ac,.bl-text-md.ac,.bl-text-lg.ac{text-align:center}
.bl-text-sm.ar,.bl-text-md.ar,.bl-text-lg.ar{text-align:right}
.bl-image{width:100%;background:var(--surface);overflow:hidden}
.bl-image img{width:100%;display:block;object-fit:cover}
.bl-image.empty{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bl-twocol{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}
.bl-quote{border-left:2px solid var(--accent);padding:0 0 0 1rem}
.bl-quote p{font-family:var(--font-s);font-size:1.4rem;font-weight:300;font-style:italic;color:var(--ink);line-height:1.4}
.bl-quote.ac{border-left:none;border-top:2px solid var(--accent);padding:1rem 0 0;text-align:center}
.bl-quote.ar{border-left:none;border-right:2px solid var(--accent);padding:0 1rem 0 0;text-align:right}
.bl-video{width:100%;aspect-ratio:16/9;background:var(--surface);overflow:hidden}
.bl-video iframe{width:100%;height:100%;border:none;display:block}
.bl-video.empty{display:flex;align-items:center;justify-content:center;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bl-stats{display:grid;gap:1px;background:var(--border);border:1px solid var(--border)}
.bl-stats .sc{background:var(--panel-bg);padding:1rem 1.25rem}
.bl-stats .sn{font-family:var(--font-s);font-size:2.2rem;font-weight:300;color:var(--accent);line-height:1;margin-bottom:.2rem}
.bl-stats .sl{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bl-divider{height:1px;background:var(--border);margin:.25rem 0}
.bl-skills{display:flex;flex-direction:column;gap:.85rem}
.skr{display:flex;flex-direction:column;gap:.35rem}
.skn{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(26,23,20,0.5)}
.skb{height:1px;background:rgba(26,23,20,0.1);position:relative;overflow:hidden}
.skf{position:absolute;top:0;left:0;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease)}
.skf.go{transform:scaleX(var(--pct))}

/* CONTACT */
.cls{display:flex;flex-direction:column}
.cl{display:flex;align-items:center;gap:1.25rem;padding:.9rem 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--ink);font-size:.88rem;transition:color .2s,padding-left .28s var(--ease)}
.cl:hover{color:var(--accent);padding-left:.5rem}
.clt{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);width:5rem;flex-shrink:0}
.fd{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:1.75rem 0 1.25rem}
.form{display:flex;flex-direction:column;gap:1.2rem}
.fg{display:flex;flex-direction:column;gap:.38rem}
.fl{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.fi,.fta{font-family:var(--font-b);font-size:.92rem;font-weight:300;background:transparent;border:none;border-bottom:1px solid var(--border);padding:.55rem 0;color:var(--ink);outline:none;width:100%;transition:border-color .2s}
.fi:focus,.fta:focus{border-color:var(--accent)}
.fi::placeholder,.fta::placeholder{color:rgba(26,23,20,0.22)}
.fta{resize:vertical;min-height:88px}
.bs{align-self:flex-start;margin-top:.5rem;font-family:var(--font-b);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);border:none;color:var(--paper);padding:.82rem 2rem;transition:opacity .2s,transform .15s}
.bs:hover{opacity:.75;transform:translateY(-1px)}
.resume-btn{display:inline-flex;align-items:center;font-family:var(--font-b);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--border);color:var(--ink);padding:.7rem 1.5rem;text-decoration:none;margin-bottom:1.75rem;transition:border-color .2s,color .2s}
.resume-btn:hover{border-color:var(--accent);color:var(--accent)}
.social-icons{display:flex;gap:.75rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:1.75rem}
.si{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--border);color:rgba(26,23,20,0.45);text-decoration:none;transition:border-color .2s,color .2s;font-size:1.1rem}
.si:hover{border-color:var(--accent);color:var(--accent)}

.log-entries{display:flex;flex-direction:column}
.log-entry{display:flex;gap:1.25rem;padding:.9rem 0;border-bottom:1px solid var(--border);align-items:baseline}
.log-date{font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);flex-shrink:0;width:5.5rem}
.log-text{font-size:.9rem;color:rgba(26,23,20,0.75);line-height:1.6;flex:1}
.log-empty{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2rem 0}
@keyframes fup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fdn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.panel,#pp{width:100vw!important;border-left:none}.wg{grid-template-columns:1fr}.bl-twocol{grid-template-columns:1fr}#ht{bottom:2rem;left:1.5rem}#sh{display:none}#nav{padding:1.2rem 1.5rem}}
</style>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div id="cur"></div>
<div id="grain"></div>
<div id="stage"><div id="reel"></div></div>

<nav id="nav">
  <a href="#" class="nl" id="nav-name" onclick="return false;"></a>
  <ul class="nls">
    <li><button onclick="openPanel('work')">Work</button></li>
    <li><button onclick="openPanel('about')">About</button></li>
    <li><button onclick="openPanel('contact')">Contact</button></li>
    <li><button onclick="openPanel('log')">Log</button></li>
  </ul>
</nav>

<div id="ht">
  <p class="htag" id="hero-role"></p>
  <h1 class="hname" id="hero-name"></h1>
</div>
<div id="log-stack"></div>
<div id="sh"><div class="avail-dot"></div><span class="avail-text">Available for work</span></div>

<div id="watch-reel-wrap">
  <button id="watch-reel" onclick="openLightbox()">
    <span class="wr-play"><span class="wr-tri"></span></span>
    Watch Reel
  </button>
</div>

<div id="lightbox">
  <div id="lb-backdrop" onclick="closeLightbox()"></div>
  <div id="lb-inner">
    <div id="lb-top">
      <span id="lb-label">Demo Reel</span>
      <button id="lb-close" onclick="closeLightbox()">&#x2715;</button>
    </div>
    <div id="lb-frame"></div>
  </div>
</div>

<div id="bd" onclick="smartClose()"></div>

<!-- WORK -->
<div class="panel wide" id="panel-work">
  <div class="ph"><span class="pt2">Work</span><button class="pc" onclick="closeToRoot()">&#x2715;</button></div>
  <div class="pb">
    <div class="wf">
      <button class="fb active" onclick="filterWork(this,'all')">All</button>
      <button class="fb" onclick="filterWork(this,'2d')">2D</button>
      <button class="fb" onclick="filterWork(this,'3d')">3D</button>
      <button class="fb" onclick="filterWork(this,'motion')">Motion</button>
    </div>
    <div class="wg" id="wg"></div>
  </div>
</div>

<!-- PROJECT DETAIL -->
<div class="panel" id="pp">
  <div class="ph">
    <button class="backbtn" onclick="closeProject()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      Back
    </button>
    <button class="pc" onclick="closeProject()">&#x2715;</button>
  </div>
  <div class="ppbody" id="ppb"></div>
</div>

<!-- LOG -->
<div class="panel" id="panel-log">
  <div class="ph"><span class="pt2">Log</span><button class="pc" onclick="closeToRoot()">&#x2715;</button></div>
  <div class="pb" id="log-body"></div>
</div>

<!-- ABOUT -->
<div class="panel" id="panel-about">
  <div class="ph"><span class="pt2">About</span><button class="pc" onclick="closeToRoot()">&#x2715;</button></div>
  <div class="pb" id="about-body"></div>
</div>

<!-- CONTACT -->
<div class="panel" id="panel-contact">
  <div class="ph"><span class="pt2">Contact</span><button class="pc" onclick="closeToRoot()">&#x2715;</button></div>
  <div class="pb" id="contact-body"></div>
</div>

<script>
const cur=document.getElementById('cur');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'},{passive:true});
const hs='a,button,.wc,.bp,.fb,.cl,.backbtn,#watch-reel,#lb-close';

// BLOCK RENDERER
function renderBlock(b){
  const al=b.align==='center'?'ac':b.align==='right'?'ar':'';
  switch(b.type){
    case 'text-sm': return`<p class="bl-text-sm ${al}">${b.content}</p>`;
    case 'text-md': return`<p class="bl-text-md ${al}">${b.content}</p>`;
    case 'text-lg': return`<p class="bl-text-lg ${al}">${b.content}</p>`;
    case 'image':
      if(b.src) return`<div class="bl-image"><img src="${b.src}" alt="${b.alt||''}"></div>`;
      return`<div class="bl-image empty">${b.alt||'Image'}</div>`;
    case 'twocol':
      return`<div class="bl-twocol"><div>${renderBlock(b.left)}</div><div>${renderBlock(b.right)}</div></div>`;
    case 'quote':
      return`<div class="bl-quote ${al}"><p>${b.content}</p></div>`;
    case 'video':
      if(b.src) return`<div class="bl-video"><iframe src="${b.src}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
      return`<div class="bl-video empty">Video embed</div>`;
    case 'stats':
      const cols=b.items.length;
      return`<div class="bl-stats" style="grid-template-columns:repeat(${cols},1fr)">${b.items.map(s=>`<div class="sc"><div class="sn" data-target="${s.num}">${s.num}</div><div class="sl">${s.label}</div></div>`).join('')}</div>`;
    case 'skills':
      return`<div class="bl-skills" id="skl">${b.items.map(s=>`<div class="skr"><div class="skn"><span>${s.name}</span><span>${s.pct}%</span></div><div class="skb"><div class="skf" style="--pct:${s.pct/100}"></div></div></div>`).join('')}</div>`;
    case 'divider':
      return`<div class="bl-divider"></div>`;
    default: return'';
  }
}
function renderBlocks(blocks){
  return`<div class="block-canvas">${blocks.map(renderBlock).join('')}</div>`;
}

async function load(){
  C=await fetch('content.json?v='+Date.now()).then(r=>r.json());
  projects=await Promise.all(C.projects.map(id=>fetch('projects/'+id+'.json?v='+Date.now()).then(r=>r.json())));
  render();
}

// Listen for live preview messages from editor
window.addEventListener('message', e=>{
  if(e.data.type==='preview-data'){
    C=e.data.content;
    projects=e.data.projects;
    render();
  }
  if(e.data.type==='preview-nav'){
    const panel=e.data.panel;
    if(panel==='home') closeToRoot();
    else if(panel==='about') openPanel('about');
    else if(panel==='contact') openPanel('contact');
    else if(panel==='project'&&e.data.projectId) {
      // make sure work panel is open behind it
      document.getElementById('panel-work').classList.add('open');
      document.getElementById('bd').classList.add('open');
      openProject(e.data.projectId);
    }
  }
});


function countUp(el){
  const raw = el.dataset.target;
  // strip commas to parse: "148,000" -> 148000, "148k" -> 148 with suffix "k"
  const stripped = raw.replace(/,/g,'');
  const match = stripped.match(/^([\d.]+)([^\d.]*)$/);
  if(!match){ el.textContent=raw; return; }
  const end = parseFloat(match[1]);
  const suffix = match[2]||'';
  const useCommas = /,/.test(raw); // preserve comma formatting
  const duration = 1800;
  const steps = 60;
  const interval = duration / steps;
  let step = 0;
  el.textContent = '0' + suffix;
  const timer = setInterval(()=>{
    step++;
    const progress = step/steps;
    const ease = 1 - Math.pow(1 - progress, 3);
    const current = Math.round(end * ease);
    const formatted = useCommas ? current.toLocaleString() : current;
    el.textContent = formatted + suffix;
    if(step >= steps){ el.textContent = raw; clearInterval(timer); }
  }, interval);
}

function initCountUps(){
  // use IntersectionObserver so they fire when panel scrolls into view
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.querySelectorAll('.sn[data-target]').forEach(el => countUp(el));
        obs.unobserve(e.target);
      }
    });
  }, {threshold: 0.5});
  document.querySelectorAll('.bl-stats').forEach(el => obs.observe(el));
}

function phosphorIcon(url){
  if(url.startsWith('mailto:')) return 'ph ph-envelope';
  if(url.includes('linkedin.com')) return 'ph ph-linkedin-logo';
  if(url.includes('instagram.com')) return 'ph ph-instagram-logo';
  if(url.includes('vimeo.com')) return 'ph ph-vimeo-logo';
  if(url.includes('youtube.com')||url.includes('youtu.be')) return 'ph ph-youtube-logo';
  if(url.includes('twitter.com')||url.includes('x.com')) return 'ph ph-x-logo';
  if(url.includes('github.com')) return 'ph ph-github-logo';
  if(url.includes('behance.net')) return 'ph ph-behance-logo';
  if(url.includes('dribbble.com')) return 'ph ph-dribbble-logo';
  if(url.includes('tiktok.com')) return 'ph ph-tiktok-logo';
  return 'ph ph-link';
}

const nearby = {
  'a':'sqerz','b':'vdnp','c':'xzvo','d':'efbs','e':'wadr','f':'tgde','g':'tfhy','h':'jgyn',
  'i':'lkuo','j':'iukh','k':'ljix','l':'kpio','m':'nwkb','n':'mbhv','o':'iplc','p':'oqbl',
  'q':'wpa','r':'etdf','s':'azxe','t':'ryfg','u':'yhio','v':'bcfx','w':'qase','x':'czv',
  'y':'uhtg','z':'xsa',
  'A':'SQERZ','B':'VDNP','C':'XZVO','D':'EFBS','E':'WADR','F':'TGDE','G':'TFHY','H':'JGYN',
  'I':'LKUO','J':'IUKH','K':'LJIX','L':'KPIO','M':'NWKB','N':'MBHV','O':'IPLC','P':'OQBL',
  'Q':'WPA','R':'ETDF','S':'AZXE','T':'RYFG','U':'YHIO','V':'BCFX','W':'QASE','X':'CZV',
  'Y':'UHTG','Z':'XSA',' ':' '
};
function pool(ch){
  const p = nearby[ch] || nearby[ch.toLowerCase()] || 'abcdefghijklmnopqrstuvwxyz';
  return (p + ch).split('');
}

function scrambleHero(role, line1, line2){

  const roleEl = document.getElementById('hero-role');
  const nameEl = document.getElementById('hero-name');

  roleEl.innerHTML = role.split('').map(ch =>
    ch===' ' ? `<span class="sc-char" data-ch=" " style="opacity:0">&nbsp;</span>`
              : `<span class="sc-char" data-ch="${ch}" style="opacity:0">${ch}</span>`
  ).join('');

  nameEl.innerHTML =
    line1.split('').map(ch =>
      `<span class="sc-char" data-ch="${ch}" style="opacity:0">${ch}</span>`
    ).join('') +
    (line2 ? '<br>' + line2.split('').map(ch =>
      `<span class="sc-char sc-em" data-ch="${ch}" style="opacity:0;color:var(--accent);font-style:italic;">${ch}</span>`
    ).join('') : '');

  // Animate a set of spans into their real characters — slower, more deliberate
  function animateSpans(spans, startDelay, charDelay, cycleMs, cycles){
    spans.forEach((span, i) => {
      const ch = span.dataset.ch;
      const isSpace = ch === ' ';
      const delay = startDelay + i * charDelay;
      const p = isSpace ? [' '] : pool(ch);
      let tick = 0;
      setTimeout(() => {
        span.style.opacity = '1';
        if(isSpace){ span.innerHTML = '&nbsp;'; return; }
        function cycle(){
          if(tick < cycles){
            // ease into the lock — last 4 ticks slow down noticeably
            const overshoot = Math.max(0, tick - (cycles - 4));
            const speed = cycleMs * (1 + overshoot * 1.4);
            span.textContent = p[tick % p.length];
            tick++;
            setTimeout(cycle, speed);
          } else {
            span.textContent = ch;
          }
        }
        cycle();
      }, delay);
    });
  }

  // Re-scramble a single span back to noise then lock again
  function rescrambleSpan(span){
    const ch = span.dataset.ch;
    if(ch === ' ') return;
    const p = pool(ch);
    const cycles = 6;
    let tick = 0;
    function cycle(){
      if(tick < cycles){
        const overshoot = Math.max(0, tick - (cycles - 3));
        const speed = 110 * (1 + overshoot * 1.6);
        span.textContent = p[tick % p.length];
        tick++;
        setTimeout(cycle, speed);
      } else {
        span.textContent = ch;
      }
    }
    cycle();
  }

  // Periodically pick a random word and ripple-scramble it
  function scheduleIdle(allSpanGroups){
    function runIdle(){
      // Pick a random group (role, line1, or line2)
      const group = allSpanGroups[Math.floor(Math.random() * allSpanGroups.length)];
      const nonSpace = group.filter(s => s.dataset.ch !== ' ');
      if(!nonSpace.length) return;

      // Pick a random contiguous run of 2–5 chars within the group
      const runLen = Math.min(nonSpace.length, 2 + Math.floor(Math.random() * 4));
      const startIdx = Math.floor(Math.random() * (nonSpace.length - runLen + 1));
      const run = nonSpace.slice(startIdx, startIdx + runLen);

      // Stagger the rescramble slightly across the run
      run.forEach((span, i) => {
        setTimeout(() => rescrambleSpan(span), i * 80);
      });

      // Schedule next idle — between 4s and 9s
      const next = 4000 + Math.random() * 5000;
      setTimeout(runIdle, next);
    }

    // First idle fires after initial animation settles
    setTimeout(runIdle, 5500);
  }

  // Timing — slower and more staggered
  const START = 600;
  const roleSpans  = Array.from(roleEl.querySelectorAll('.sc-char'));
  const nameSpans  = Array.from(nameEl.querySelectorAll('.sc-char:not(.sc-em)'));
  const emSpans    = Array.from(nameEl.querySelectorAll('.sc-em'));

  const roleDuration = roleSpans.length * 60;
  animateSpans(roleSpans, START, 60, 90, 7);

  const nameLine1Start = START + roleDuration * 0.55;
  animateSpans(nameSpans, nameLine1Start, 90, 100, 8);

  const nameLine2Start = nameLine1Start + nameSpans.length * 90 * 0.4;
  animateSpans(emSpans, nameLine2Start, 90, 100, 8);

  // Start idle rescramble after everything has settled
  scheduleIdle([roleSpans, nameSpans, emSpans]);
}


async function loadLog(){
  try{
    const entries = await fetch('log.json?v='+Date.now()).then(r=>r.json());

    // Panel
    const el = document.getElementById('log-body');
    if(!entries.length){
      el.innerHTML='<p class="log-empty">Nothing here yet.</p>';
    } else {
      el.innerHTML='<div class="log-entries">'+
        [...entries].reverse().map(e=>
          `<div class="log-entry"><span class="log-date">${e.date}</span><span class="log-text">${e.text}</span></div>`
        ).join('')+
      '</div>';
    }

    // Hero stack — last 8, newest at bottom, oldest most faded
    const stack = document.getElementById('log-stack');
    const recent = entries.slice(-8); // oldest to newest
    stack.innerHTML = recent.map((e, i) => {
      // i=0 is oldest (most faded), i=7 is newest (most visible)
      const opacity = 0.1 + (i / (recent.length - 1 || 1)) * 0.9;
      return `<span class="ls-entry" style="opacity:0" data-opacity="${opacity}">${e.text}</span>`;
    }).join('');

    // Stagger fade in + scramble each entry
    const items = Array.from(stack.querySelectorAll('.ls-entry'));
    const logSpanGroups = [];

    items.forEach((item, i) => {
      const finalOpacity = item.dataset.opacity;
      const text = item.textContent;

      // Build char spans
      item.innerHTML = text.split('').map(ch =>
        ch === ' '
          ? `<span class="sc-char" data-ch=" " style="opacity:0">&nbsp;</span>`
          : `<span class="sc-char" data-ch="${ch}" style="opacity:0">${ch}</span>`
      ).join('');

      const spans = Array.from(item.querySelectorAll('.sc-char'));
      logSpanGroups.push(spans);

      const entryDelay = 1400 + i * 120;

      setTimeout(() => {
        item.style.opacity = finalOpacity;
        item.classList.add('show');
        // reveal chars with scramble
        spans.forEach((span, j) => {
          const ch = span.dataset.ch;
          const isSpace = ch === ' ';
          const p = isSpace ? [' '] : pool(ch);
          let tick = 0;
          const cycles = 6;
          setTimeout(() => {
            span.style.opacity = '1';
            if(isSpace){ span.innerHTML = '&nbsp;'; return; }
            function cycle(){
              if(tick < cycles){
                const overshoot = Math.max(0, tick - (cycles - 3));
                const speed = 90 * (1 + overshoot * 1.4);
                span.textContent = p[tick % p.length];
                tick++;
                setTimeout(cycle, speed);
              } else {
                span.textContent = ch;
              }
            }
            cycle();
          }, j * 55);
        });
      }, entryDelay);
    });

    // Idle rescramble for log stack — fires after all entries settled
    const logIdleStart = 1400 + items.length * 120 + 2000;
    setTimeout(() => scheduleIdle(logSpanGroups), logIdleStart);

  }catch(e){
    document.getElementById('log-body').innerHTML='<p class="log-empty">Could not load log.</p>';
  }
}

function render(){
  document.getElementById('nav-name').textContent=C.name;
  document.title=C.name+' — Animator';
  const parts=C.name.split(' ');
  const line1=parts[0];
  const line2=parts.slice(1).join(' ');
  scrambleHero(C.role, line1, line2);

  const reelEl=document.getElementById('reel');
  if(C.reel&&C.reel.url){
    if(C.reel.type==='youtube')reelEl.innerHTML=`<iframe src="${C.reel.url}" allow="autoplay; fullscreen" allowfullscreen></iframe><div id="reel-block"></div>`;
    else if(C.reel.type==='vimeo')reelEl.innerHTML=`<iframe src="${C.reel.url}" allow="autoplay; fullscreen" allowfullscreen></iframe><div id="reel-block"></div>`;
    else if(C.reel.type==='video')reelEl.innerHTML=`<video autoplay muted loop playsinline src="${C.reel.url}"></video><div id="reel-block"></div>`;
  }else{
    reelEl.innerHTML=`<div id="rp"><div class="pg"></div><div class="pi"><div class="bp"><div class="bpt"></div></div><p class="pl">Demo Reel Goes Here</p></div></div>`;
  }

  document.getElementById('wg').innerHTML=projects.map(p=>`
    <div class="wc" data-type="${p.type}" onclick="openProject('${p.id}')">
      <div class="wci">${p.thumbnail?`<img src="${p.thumbnail}" alt="${p.title}">`:thumb(p.type)}<div class="wco">View Project &#x2192;</div></div>
      <div class="wcm"><p class="wct">${p.title}</p><p class="wcty">${p.typeLabel} &middot; ${p.year}</p></div>
    </div>`).join('');

  document.getElementById('about-body').innerHTML=renderBlocks(C.about||[]);
  setTimeout(initCountUps, 100);
  loadLog();

  document.getElementById('contact-body').innerHTML=`
    ${C.contact.resume ? `<div style="display:flex;justify-content:center;margin-bottom:1.75rem"><a href="${C.contact.resume}" target="_blank" rel="noopener" class="resume-btn">View Resume</a></div>` : ""}
    <div class="social-icons">${(C.contact.links||[]).map(l=>`<a href="${l.url}" target="${l.url.startsWith("mailto")?"_self":"_blank"}" rel="noopener" class="si" title="${l.label}"><i class="${phosphorIcon(l.url)}"></i></a>`).join("")}</div>
    <p class="fd">&#8212; or send a message</p>
    <form class="form" onsubmit="handleSubmit(event)">
      <div class="fg"><label class="fl">Name</label><input type="text" class="fi" id="fc-name" placeholder="Jane Smith" required></div>
      <div class="fg"><label class="fl">Email</label><input type="email" class="fi" id="fc-email" placeholder="jane@studio.com" required></div>
      <div class="fg"><label class="fl">Project type</label><input type="text" class="fi" id="fc-type" placeholder="2D animation, motion graphics&#8230;"></div>
      <div class="fg"><label class="fl">Message</label><textarea class="fta" id="fc-msg" placeholder="Tell me about your project&#8230;"></textarea></div>
      <button type="submit" class="bs">Send Message</button>
    </form>`;
}

function openPanel(name){
  document.getElementById('pp').classList.remove('open');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
  document.getElementById('bd').classList.add('open');
  document.getElementById('panel-'+name).classList.add('open');
  document.querySelectorAll('.nls button').forEach(b=>b.classList.remove('active'));
  const btn=[...document.querySelectorAll('.nls button')].find(b=>b.getAttribute('onclick').includes("'"+name+"'"));
  if(btn)btn.classList.add('active');
  if(name==='about')setTimeout(()=>document.querySelectorAll('#skl .skf').forEach(b=>b.classList.add('go')),340);
}

function openProject(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  document.getElementById('ppb').innerHTML=renderBlocks(p.blocks||[]);
  document.getElementById('ppb').scrollTop=0;
  document.getElementById('pp').classList.add('open');
}

function openLightbox(){
  if(!C.reel||!C.reel.url){alert('Add your reel URL to content.json first!');return;}
  let src=C.reel.url;
  if(C.reel.type==='youtube'){src=src.replace('&controls=0','').replace('&mute=1','');if(!src.includes('controls=1'))src+='&controls=1';}
  else if(C.reel.type==='vimeo'){src=src.replace('background=1','background=0').replace('&muted=1','');}
  document.getElementById('lb-frame').innerHTML=`<iframe src="${src}&autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  setTimeout(()=>{document.getElementById('lb-frame').innerHTML=''},400);
}
function smartClose(){
  if(document.getElementById('pp').classList.contains('open'))closeProject();
  else closeToRoot();
}
function closeProject(){document.getElementById('pp').classList.remove('open')}
function closeToRoot(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
  document.getElementById('bd').classList.remove('open');
  document.querySelectorAll('.nls button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#skl .skf').forEach(b=>b.classList.remove('go'));
}
function filterWork(btn,type){
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('#wg .wc').forEach(c=>{const show=type==='all'||c.dataset.type===type;c.style.opacity=show?'1':'0.15';c.style.pointerEvents=show?'':'none'});
}
function handleSubmit(e){
  e.preventDefault();
  const name=document.getElementById('fc-name').value;
  const email=document.getElementById('fc-email').value;
  const type=document.getElementById('fc-type').value;
  const msg=document.getElementById('fc-msg').value;
  const subject=encodeURIComponent((type?type+' inquiry':'Project inquiry'));
  const body=encodeURIComponent('Hi,\n\nMy name is '+name+' ('+email+').\n\n'+(type?'Project type: '+type+'\n\n':'')+msg);
  window.location.href='mailto:'+C.contact.email+'?subject='+subject+'&body='+body;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('lightbox').classList.contains('open'))closeLightbox();
    else if(document.getElementById('pp').classList.contains('open'))closeProject();
    else closeToRoot();
  }
});
load();
</script>
