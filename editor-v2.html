<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Editor v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<!-- Display styles (for rendering site content on canvas) -->
<link rel="stylesheet" href="styles-main.css">
<!-- Editor chrome (overrides where needed) -->
<link rel="stylesheet" href="styles-editor-v2.css">
</head>
<body>

<div id="v2-app">
  <!-- SIDEBAR -->
  <div id="v2-sidebar">
    <div class="v2-sidebar-logo"><span>RGR Studio</span>Editor v2</div>

    <div class="v2-sidebar-section">Sections</div>
    <div id="v2-sidebar-nav"></div>

    <div class="v2-sidebar-section">Projects</div>
    <div id="v2-sidebar-projects"></div>

    <div id="v2-sidebar-context"></div>

    <div class="v2-sidebar-section">Settings</div>
    <button id="v2-theme-btn" class="v2-nav-item v2-theme-btn">Theme</button>

    <div class="v2-sidebar-footer">
      <button id="v2-save-btn" class="v2-save-btn" disabled>Save</button>
      <div id="v2-auth-status" class="v2-auth-status"></div>
      <a href="index.html" target="_blank">View Live Site &#x2197;</a>
      <a href="editor.html">Switch to v1 Editor</a>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="v2-canvas">
    <div id="v2-canvas-inner">
      <div class="v2-loading">Loading site data…</div>
    </div>
  </div>
</div>

<!-- FLOATING INSPECTOR (positioned by JS, outside grid) -->
<div id="v2-inspector"></div>

<div id="v2-toast"></div>

<script>
  // API config — pick up from URL param or localStorage (same pattern as v1)
  const params = new URLSearchParams(location.search);
  const apiParam = params.get('api');
  const tokenParam = params.get('session_token');
  if (tokenParam) {
    localStorage.setItem('editor_session_token', tokenParam);
    params.delete('session_token');
    const next = `${location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
    history.replaceState({}, '', next);
  }
  if (apiParam) localStorage.setItem('editor_api_base', apiParam);
  window.__V2_API_BASE = apiParam || localStorage.getItem('editor_api_base') || 'https://rgr-editor-backend.rungirlrun.workers.dev';
</script>

<script type="module">
  import { loadSiteData, checkAuth, getLoginUrl, getLogoutUrl, saveSiteData, isDirty, state as bridgeState } from './src/editor-v2/dataBridge.js';
  import { renderCanvas, renderSidebarProjects, initEditing, showThemeEditor } from './src/editor-v2/canvas.js';
  import { initHistory, undo, redo, canUndo, canRedo } from './src/editor-v2/history.js';

  // ── Toast helper ──
  function toast(msg, isError) {
    const el = document.getElementById('v2-toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  // ── Auth UI ──
  async function initAuth() {
    const el = document.getElementById('v2-auth-status');
    const saveBtn = document.getElementById('v2-save-btn');
    const auth = await checkAuth();
    if (auth) {
      el.innerHTML = `<span class="v2-auth-user">${auth.user || 'Logged in'}</span> <a href="${getLogoutUrl()}" class="v2-auth-link">Logout</a>`;
      saveBtn.disabled = false;
    } else {
      el.innerHTML = `<a href="${getLoginUrl()}" class="v2-auth-link">Log in to save</a>`;
      saveBtn.disabled = true;
    }
  }

  // ── Save button ──
  function initSave() {
    const btn = document.getElementById('v2-save-btn');
    btn.addEventListener('click', async () => {
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Saving…';
      const result = await saveSiteData();
      if (result.success) {
        toast(result.message || 'Saved ✓');
      } else {
        toast('Error: ' + result.error, true);
        if (result.error && result.error.includes('Unauthorized')) {
          initAuth(); // re-check auth state
        }
      }
      btn.disabled = false;
      updateSaveBtn();
    });

    // Ctrl/Cmd+S shortcut
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 's') {
        e.preventDefault();
        btn.click();
      }
    });

    // Listen for dirty status changes
    window.addEventListener('v2-save-status', updateSaveBtn);
  }

  function updateSaveBtn() {
    const btn = document.getElementById('v2-save-btn');
    if (!btn) return;
    const dirty = isDirty();
    btn.textContent = dirty ? 'Save *' : 'Save';
    btn.classList.toggle('v2-save-dirty', dirty);
  }

  // ── Init ──
  async function init() {
    try {
      await loadSiteData();
      renderCanvas();
      renderSidebarProjects();
      initEditing();
      initSave();
      initAuth();
      document.getElementById('v2-theme-btn')?.addEventListener('click', showThemeEditor);

      // Undo/redo setup
      initHistory(() => {
        renderCanvas();
        renderSidebarProjects();
      });

      document.addEventListener('keydown', e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
          e.preventDefault();
          if (undo(bridgeState)) {
            renderCanvas();
            renderSidebarProjects();
          }
        }
        if ((e.metaKey || e.ctrlKey) && (e.key === 'Z' || (e.key === 'z' && e.shiftKey)) ) {
          e.preventDefault();
          if (redo(bridgeState)) {
            renderCanvas();
            renderSidebarProjects();
          }
        }
      });
    } catch (err) {
      console.error('v2 init failed:', err);
      const inner = document.getElementById('v2-canvas-inner');
      if (inner) inner.innerHTML = `<div class="v2-loading" style="color:#c06060;">Failed to load: ${err.message}</div>`;
    }
  }

  init();
</script>
</body>
</html>
