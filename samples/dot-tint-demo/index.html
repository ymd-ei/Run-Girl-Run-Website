<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dot Tint Demo</title>
<style>
  :root{--accent:#5e30eb;--tint:30%;--paper-rgb:240,236,228}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#16141c;color:rgb(var(--paper-rgb));font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{display:flex;flex-direction:column;gap:2rem;align-items:center}
  .controls{display:flex;flex-wrap:wrap;gap:1.25rem;align-items:center;font-size:.8rem;color:rgba(var(--paper-rgb),.7)}
  .controls label{display:flex;align-items:center;gap:.5rem}
  input[type=color]{width:2.5rem;height:2rem;border:none;background:none;padding:0;cursor:pointer}
  output{font-variant-numeric:tabular-nums;min-width:3ch}

  /* Same as the site's #sh block */
  .sh{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;padding:2rem 2.5rem;border:1px solid rgba(var(--paper-rgb),.08);border-radius:8px}
  .row{display:flex;align-items:center;gap:.65rem}
  .text{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--paper-rgb),.45)}
  .dot{--dot:color-mix(in oklch,#3ecf8e calc(100% - var(--tint)),var(--accent));width:7px;height:7px;border-radius:50%;background:var(--dot);flex-shrink:0;box-shadow:0 0 6px color-mix(in srgb,var(--dot) 55%,transparent);animation:pulse 2.4s ease-in-out infinite}
  .dot.plain{--dot:#3ecf8e}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
  .cap{font-size:.65rem;color:rgba(var(--paper-rgb),.35);text-align:center;margin-top:.5rem}
  .pair{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center}
  .accent-word{color:var(--accent);font-style:italic;font-size:1.6rem;font-family:Georgia,serif}
</style>
</head>
<body>
<div class="wrap">
  <div class="accent-word">Girl Run</div>
  <div class="controls">
    <label>Accent <input type="color" id="accent" value="#5e30eb"></label>
    <label>Tint <input type="range" id="tint" min="0" max="60" value="30"> <output id="tintOut">30%</output></label>
  </div>
  <div class="pair">
    <div>
      <div class="sh">
        <div class="row"><div class="dot"></div><span class="text">In FFXIV · Limsa Lominsa Upper Decks · Seraph</span></div>
        <div class="row"><div class="dot"></div><span class="text">Available for work</span></div>
      </div>
      <div class="cap">Tinted</div>
    </div>
    <div>
      <div class="sh">
        <div class="row"><div class="dot plain"></div><span class="text">In FFXIV · Limsa Lominsa Upper Decks · Seraph</span></div>
        <div class="row"><div class="dot plain"></div><span class="text">Available for work</span></div>
      </div>
      <div class="cap">Plain green</div>
    </div>
  </div>
</div>
<script>
  const root=document.documentElement;
  document.getElementById('accent').addEventListener('input',e=>root.style.setProperty('--accent',e.target.value));
  const out=document.getElementById('tintOut');
  document.getElementById('tint').addEventListener('input',e=>{root.style.setProperty('--tint',e.target.value+'%');out.textContent=e.target.value+'%';});
</script>
</body>
</html>
