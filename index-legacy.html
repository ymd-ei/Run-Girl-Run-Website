<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="icon" id="favicon" href="">
<link rel="apple-touch-icon" id="favicon-apple" href="">
<link rel="mask-icon" id="favicon-mask" href="" color="#71904c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles-main.css"><style id="theme-vars"></style>
<style id="pattern-styles"></style>
</head>
<body>
<div id="cur"></div>
<div id="grain"></div>

<!-- LOADER -->
<div id="loader">
  <div id="loader-name"></div>
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
</div>

<div id="stage"><div id="reel"></div></div>

<nav id="nav">
  <a href="#" class="nl" id="nav-name" onclick="return false;"></a>
  <ul class="nls">
    <li><button onclick="openPanel('work')">Work</button></li>
    <li><button onclick="openPanel('about')">About</button></li>
    <li><button onclick="openPanel('contact')">Contact</button></li>
  </ul>
</nav>

<div id="ht">
  <p class="htag" id="hero-role"></p>
  <h1 class="hname" id="hero-name"></h1>
</div>
<div id="log-stack"><div id="ls-inner" class="ls-inner"></div></div>
<div id="sh"><div class="avail-dot"></div><span class="avail-text">Available for work</span></div>

<div id="watch-reel-wrap">
  <button id="watch-reel" onclick="openLightbox()">
    <span class="wr-play"><span class="wr-tri"></span></span>
    Watch Reel
  </button>
</div>

<div id="lightbox">
  <div id="lb-backdrop" onclick="closeLightbox()"></div>
  <div id="lb-inner">
    <div id="lb-top">
      <span id="lb-label">Demo Reel</span>
      <button id="lb-close" onclick="closeLightbox()">&#x2715;</button>
    </div>
    <div id="lb-frame"></div>
  </div>
</div>

<div id="bd" onclick="smartClose()"></div>

<!-- WORK -->
<div class="panel wide" id="panel-work">
  <div class="ph"><span class="pt2">Work</span><button class="pc" onclick="closeToRoot()">&#x2715;</button></div>
  <div class="pb">
    <div class="wf" id="work-filters"></div>
    <div class="wg" id="wg"></div>
  </div>
</div>

<!-- PROJECT DETAIL -->
<div class="panel" id="pp">
  <div class="ph">
    <button class="backbtn" onclick="closeProject()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      Back
    </button>
    <button class="pc" onclick="closeProject()">&#x2715;</button>
  </div>
  <div class="ppbody" id="ppb"></div>
</div>

<!-- LOG -->
<div class="panel" id="panel-log">
  <div class="ph"><span class="pt2">Log</span><button class="pc" onclick="closeToRoot()">&#x2715;</button></div>
  <div class="pb" id="log-body"></div>
</div>

<!-- ABOUT -->
<div class="panel" id="panel-about">
  <div class="ph"><span class="pt2">About</span><button class="pc" onclick="closeToRoot()">&#x2715;</button></div>
  <div class="pb" id="about-body"></div>
</div>

<!-- CONTACT SLIVER + CLOSE -->
<div id="ct-sliver" onclick="closeToRoot()"></div>
<button id="ct-close" onclick="closeToRoot()">&#x2715;</button>

<!-- CONTACT PANEL -->
<div id="contact-wrapper">
  <div id="ct-bg">
    <div id="ct-bg-video"></div>
    <div id="ct-bg-grad"></div>
    <div id="ct-bg-dark"></div>
    <div id="ct-bg-grain"></div>
  </div>
  <div id="ct-content">
    <div id="ct-splash">
      <div class="ct-ticker tape-top reverse" id="ct-ticker-top">
        <div class="ticker-track"></div>
      </div>
      <p class="ct-tag" id="ct-location"></p>
      <h1 class="ct-hero">Let's<br><span class="accent-word">work.</span></h1>
      <p class="ct-sub">Animation, motion, original features — whatever the idea, we're built for it. Let's talk.</p>
      <div class="ct-scroll-cue"><span class="ct-scroll-line"></span>See how to reach us</div>
    </div>
    <div class="ct-ticker tape-mid" id="ct-ticker-mid">
      <div class="ticker-track"></div>
    </div>
    <div id="ct-links">
      <div class="ct-email-block">
        <p class="ct-email-label">Drop us a line</p>
        <a id="ct-email-link" href="#" class="ct-email-link">
          <span id="ct-email-text"></span>
          <i class="ph-fill ph-arrow-up-right arr"></i>
        </a>
      </div>
      <div id="ct-social-wrap">
        <p class="ct-social-label">Find us</p>
        <div class="ct-icons" id="ct-icons"></div>
      </div>
      <div class="ct-resume-block" id="ct-resume-wrap" style="display:none">
        <p class="ct-email-label">Credentials</p>
        <a id="ct-resume-link" href="#" target="_blank" class="ct-resume-link">
          <i class="ph-fill ph-file-pdf"></i>
          View Resume
          <i class="ph-fill ph-arrow-right"></i>
        </a>
      </div>
    </div>
    <div class="ct-footer">
      <span id="ct-footer-name"></span>
      <div class="ct-footer-dot"></div>
      <span id="ct-footer-loc"></span>
    </div>
  </div>
</div>

<script defer src="utils.js"></script>
<script defer src="main.js"></script>

</body>
</html>
