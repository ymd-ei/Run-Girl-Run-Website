<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Links — Run Girl Run</title>
<!-- rungirlrun.studio/links — a Linktree-style page: one phone-first design for every
     screen. Content is live (src/utils/liveContent.js): name, links, colours from Site
     settings; socials ticked "Links page"; subtitles + extra links from Site settings →
     Links page.
     The card has a back: tap the dog (no hint, on purpose) or swipe sideways and it turns
     over into a square of tinted glass with the QR for this page; swipe sideways again (or
     Escape) to turn it back. The frosted hero reel fills the page behind. Designed in
     samples/links-flip-mock/. -->
<meta name="description" content="Run Girl Run — 3D character animation, Toronto. Reel, portfolio, 3D modelling, résumé and socials.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rungirlrun.studio/links">
<meta property="og:site_name" content="Run Girl Run">
<meta property="og:title" content="Run Girl Run — links">
<meta property="og:description" content="Reel, portfolio, 3D modelling, résumé and socials.">
<meta property="og:image" content="https://rungirlrun.studio/media/jammeratoast%20jammers.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../media/rgr_fav.png">
<link rel="canonical" href="https://rungirlrun.studio/links">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<script src="../site-config.js"></script>
<style>
  :root{
    --ink:#1a1714;--ink-rgb:26,23,20;--paper:#f2ede4;--card:#f7f3ec;--accent:#5e30eb;--ct-accent:#ff4361;
    --font-s:'Cormorant Garamond',serif;--font-b:'DM Sans',sans-serif;
    --line:rgba(var(--ink-rgb),.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--paper)}
  body{
    min-height:100svh;font-family:var(--font-b);font-weight:300;color:var(--ink);
    background:var(--paper);-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;align-items:flex-start;   /* don't stretch the column to the window height */
  }
  /* A card on every screen, so the front matches the back when it flips */
  body{padding:calc(.75rem + env(safe-area-inset-top)) .75rem calc(.75rem + env(safe-area-inset-bottom))}
  .page{
    width:100%;max-width:440px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.15rem 1.9rem;
    box-shadow:0 24px 60px -30px rgba(var(--ink-rgb),.35);
  }
  @media (min-width:640px){
    body{padding:3rem 1rem;align-items:center}
    .page{padding:2rem 1.75rem 2.25rem}
  }

  /* ── Top: dog + availability, then the name ── */
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
  .bar img{height:2.1rem;filter:brightness(0);opacity:.85}   /* the logo is white (made for the dark hero) */
  .avail{display:flex;align-items:center;gap:.45rem;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--ink-rgb),.6)}
  .avail i{width:6px;height:6px;border-radius:50%;background:#36c97f;box-shadow:0 0 0 3px rgba(54,201,127,.18)}
  .role{font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
  h1{font-family:var(--font-s);font-weight:700;font-size:clamp(3rem,15vw,3.9rem);line-height:.88;letter-spacing:.005em}
  h1 em{color:var(--accent)}
  .where{margin-top:.7rem;font-size:.85rem;color:rgba(var(--ink-rgb),.55)}

  /* ── Social icons: one row under the name, like Linktree ── */
  .icons{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem 1.1rem;margin-top:1.4rem}
  .icons a{
    position:relative;display:grid;place-items:center;width:2.4rem;height:2.4rem;
    color:var(--ink);font-size:1.45rem;text-decoration:none;opacity:.85;
    transition:transform .15s ease,opacity .15s ease,color .15s ease;
  }
  .icons a:hover{opacity:1;color:var(--accent)}
  .icons a:active{transform:scale(.92)}
  .icons a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  /* tells the two Instagrams apart */
  .icons a .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-8px;white-space:nowrap;padding:1px 4px;border-radius:6px;
    background:var(--accent);color:#fff;font-size:.5rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

  /* ── Featured: the reel ── */
  .reel{
    position:relative;display:block;margin:1.75rem 0 .75rem;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
    background:#111;color:#fff;text-decoration:none;isolation:isolate;
  }
  .reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75;z-index:-1}
  .reel .play{
    position:absolute;inset:0;width:100%;padding:1rem;display:flex;flex-wrap:wrap;align-content:flex-end;align-items:center;gap:.7rem;
    font:inherit;font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:#fff;background:linear-gradient(to top,rgba(0,0,0,.45),transparent 60%);border:0;cursor:pointer;text-align:left;
  }
  .reel.playing video{opacity:1;object-fit:contain;background:#000}
  .reel.playing .play{display:none}
  .reel .play b{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;
    background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)}
  .reel .play b i{font-size:1rem;margin-left:2px}

  /* ── Link rows ── */
  .group{margin-top:1.6rem}
  .group h2{font-size:.66rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(var(--ink-rgb),.45);margin-bottom:.55rem}
  .links{display:grid;gap:.5rem}
  .link{
    display:flex;align-items:center;gap:.85rem;min-height:3.4rem;padding:.7rem .95rem;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    color:inherit;text-decoration:none;transition:transform .15s ease,border-color .15s ease,background .15s ease;
  }
  .link{background:var(--paper)}
  .link:hover{border-color:rgba(var(--ink-rgb),.3)}
  .link:active{transform:scale(.985)}
  .link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .link .ic{flex:0 0 auto;display:grid;place-items:center;width:2rem;height:2rem;border-radius:8px;
    background:rgba(var(--ink-rgb),.06);font-size:1.05rem}
  .link .tx{flex:1;min-width:0;display:grid}
  .link .tx b{font-weight:500;font-size:.95rem}
  .link .tx small{font-size:.75rem;color:rgba(var(--ink-rgb),.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link .go{flex:0 0 auto;color:rgba(var(--ink-rgb),.35);font-size:.9rem}
  /* Main links read bigger and use the accent */
  .link.main{min-height:3.9rem}
  .link.main .ic{background:var(--accent);color:#fff}
  .socials .link{min-height:3rem}

  /* ── Email ── */
  .mail{
    margin-top:1.6rem;display:flex;align-items:center;gap:.6rem;padding:.9rem .95rem;border-radius:10px;
    background:var(--ink);color:var(--paper);
  }
  .mail a{flex:1;color:inherit;text-decoration:none;font-weight:400;font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .mail button{
    flex:0 0 auto;font:inherit;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);background:var(--ct-accent);border:0;border-radius:6px;padding:.5rem .7rem;cursor:pointer;
  }
  .mail button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

  footer{margin-top:2rem;display:flex;justify-content:center;gap:1rem;font-size:.72rem;color:rgba(var(--ink-rgb),.45)}
  footer a,footer button{color:inherit;font:inherit;background:none;border:0;cursor:pointer;text-decoration:none}
  footer a:hover,footer button:hover{color:var(--ink)}
  /* Lite mode / data-saver / reduced motion: the reel card keeps a still cover */
  .reel.still video{opacity:.6}

  /* Privacy & Legal popup (siteChrome.js renders the text) */
  #legal-modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s ease}
  #legal-modal.open{opacity:1}
  #legal-card{position:relative;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:1.75rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
    background:var(--card);border-radius:12px 12px 0 0;transform:translateY(24px);transition:transform .28s ease}
  #legal-modal.open #legal-card{transform:translateY(0)}
  @media (min-width:640px){ #legal-modal{align-items:center} #legal-card{border-radius:12px} }
  #legal-card h2{font-family:var(--font-s);font-size:1.8rem;font-weight:400;margin-bottom:1rem}
  .legal-section{margin-bottom:1.1rem}
  .legal-section h3{font-size:.66rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem}
  .legal-section p{font-size:.9rem;line-height:1.6;color:rgba(var(--ink-rgb),.7);margin-bottom:.45rem}
  .legal-section a{color:var(--accent)}
  .legal-close{position:absolute;top:1rem;right:1rem;padding:.35rem .7rem;border:1px solid var(--line);border-radius:6px;background:none;font:inherit;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important} }

  /* ── The hero reel, frosted, behind the card ── */
  .page-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--paper)}
  .page-bg video,.page-bg img{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(34px) saturate(1.25)}
  .page-bg::after{content:"";position:absolute;inset:0;background:rgba(20,16,12,.12)}   /* a touch darker so the card and code read */
  body.bg-video{background:transparent;padding-left:1rem;padding-right:1rem}
  html:has(body.bg-video){background:#2a2622}
  /* the same drop shadow on both sides, so the card lifts off the reel as one object */
  body.bg-video{--card-drop:0 2px 6px rgba(0,0,0,.18),0 22px 48px -10px rgba(0,0,0,.55)}
  body.bg-video .page{box-shadow:var(--card-drop)}
  body.bg-video .back{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),var(--card-drop)}
  /* the back becomes a pane of tinted glass over the page's reel */
  /* no backdrop-filter here: Safari draws it flat, outside the 3D turn, so the code popped in mid-flip */
  body.bg-video .back{background:transparent}
  body.bg-video .back::before{background:radial-gradient(circle at 50% 45%,rgba(10,8,6,.4),rgba(10,8,6,.56))}

  /* ── The flip: the card's back holds the QR ── */
  body{align-items:center}
  .flipper{
    --t:.75s;--ease:cubic-bezier(.65,0,.25,1);
    /* one box for both sides: it morphs from the front's shape to the square, and
       each side fills it, so they always match */
    position:relative;width:100%;max-width:440px;margin:0 auto;transform-style:preserve-3d;
    transform:perspective(1800px) rotateY(var(--a,0deg));
    transition:transform var(--t) var(--ease),height var(--t) var(--ease),width var(--t) var(--ease);
  }
  .flipper.dragging{transition:none}
  /* The side facing away is hidden outright, not just turned away: Safari draws videos
     (and blurred bits) on layers that ignore backface-visibility, so the front's reel
     showed through the QR on iPad. JS flips .back-facing as the card passes edge-on. */
  .flipper.back-facing .front,.flipper:not(.back-facing) .back{visibility:hidden}
  .face{position:absolute;top:0;left:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .front{height:100%;overflow:hidden;touch-action:pan-y}   /* up/down scrolls; sideways turns the card */
  .back{
    inset:0;width:auto;transform:rotateY(180deg);container-type:size;
    border-radius:14px;overflow:hidden;background:#141210;color:#fff;isolation:isolate;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 24px 60px -30px rgba(var(--ink-rgb),.6);
  }
  .flipper.dragging .back{cursor:grabbing}
  /* while the QR is up the whole screen takes the swipe — no pull-to-refresh */
  html.qr-up,html.qr-up body{overscroll-behavior:none;touch-action:none}
  html.qr-up body{padding-top:1rem;padding-bottom:1rem}   /* matches the 32px side() leaves */
  /* frosted glass: the reel, blurred and darkened so the white code reads */
  .back video,.back .still{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;z-index:-2;
    filter:blur(22px) saturate(1.35);pointer-events:none}
  .back::before{content:"";position:absolute;inset:0;z-index:-1;
    background:radial-gradient(circle at 50% 45%,rgba(10,8,6,.38),rgba(10,8,6,.62))}
  /* Nothing inside the back has a CSS transform of its own: Safari lifts such pieces
     out of the 3D turn, so they'd pop in instead of turning with the card. The diamond
     is drawn already turned in the SVG; the dog is centred with margins. */
  .back .qr-diamond{position:relative;width:84cqmin;aspect-ratio:1;flex:none}   /* the box's shorter side */
  .back .qr,.back .qr svg{display:block;width:100%;height:100%}
  .back .qr-dog{position:absolute;inset:0;margin:auto;height:auto;pointer-events:none}
  .stage{position:relative;width:100%;max-width:440px}
  /* the dog: a quiet way in */
  .dog{background:none;border:0;padding:0;cursor:pointer;line-height:0;border-radius:6px;-webkit-tap-highlight-color:transparent}
  .back:focus{outline:none}
  .dog:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .dog:active img{transform:scale(.94)}
  .dog img{transition:transform .15s ease}
  /* reduced motion: no turning — the sides crossfade */
  @media (prefers-reduced-motion: reduce){
    .flipper{transform:none !important}
    .back{transform:none}
    .face{backface-visibility:visible;-webkit-backface-visibility:visible;transition:opacity .3s ease !important}
    .flipper:not(.flipped) .back,.flipper.flipped .front{opacity:0;pointer-events:none}
  }
</style>
</head>
<body>
<div class="stage">
<div class="flipper" id="flipper">
<main class="page face front" id="front">
 <div id="front-in">
  <div class="bar">
    <button type="button" class="dog" id="flip-open" aria-label="Show QR code"><img id="dog" src="../media/doog_loop-smoller.png" alt=""></button>
    <span class="avail" id="avail" hidden><i></i><span></span></span>
  </div>
  <p class="role" id="role"></p>
  <h1 id="name">Run<br><em>Girl Run</em></h1>
  <p class="where" id="where"></p>
  <nav class="icons" id="icons" aria-label="Social links"></nav>

  <div class="reel" id="reel" hidden></div>

  <section class="group" id="extra-group" hidden>
    <h2 id="extra-title">Featured</h2>
    <div class="links" id="extra"></div>
  </section>
  <section class="group">
    <h2>Work</h2>
    <div class="links" id="work"></div>
  </section>
  <section class="group" id="writing-group" hidden>
    <h2>Writing</h2>
    <div class="links" id="writing"></div>
  </section>

  <div class="mail" id="mail" hidden>
    <i class="ph-fill ph-envelope" aria-hidden="true"></i>
    <a id="mail-link" href="#"></a>
    <button type="button" id="copy">Copy</button>
  </div>

  <footer>
    <a href="../">rungirlrun.studio</a>
    <button type="button" class="legal-trigger" onclick="openLegalModal()">Privacy &amp; Legal</button>
  </footer>
 </div>
</main>
<section class="face back" id="back" aria-label="QR code for this page. Press Escape to turn the card back." tabindex="-1" inert>
  <div class="qr-diamond">
    <div class="qr" id="qr" role="img" aria-label="QR code for rungirlrun.studio/links"></div>
    <img class="qr-dog" id="qr-dog" alt="" aria-hidden="true">
  </div>
</section>
</div>
</div>
<div id="legal-modal" role="dialog" aria-modal="true" aria-labelledby="legal-title" onclick="if(event.target===this)closeLegalModal()">
  <div id="legal-card"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
  import { liveFetch } from '../src/utils/liveContent.js';
  import { showsOn } from '../src/utils/socials.js';
  import { phosphorIcon } from '../src/utils/icons.js';
  import { stillVideos } from '../src/utils/lite.js';
  import { pauseVideosWhenIdle } from '../src/utils/idleVideos.js';
  import { setRefContext, resolveLinkUrl } from '../src/utils/refs.js';
  import { renderLegal, initLegalModal } from '../src/display/siteChrome.js';
  import { applyThemeVars } from '../src/utils/themeVars.js';

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const media = p => !p ? '' : /^(https?:|data:|\/)/.test(p) ? p : '../' + encodeURI(p);
  const handle = url => url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
  const row = ({ label, url, sub, icon, main }) => `
    <a class="link${main ? ' main' : ''}" href="${esc(url)}"${/^https?:/.test(url) ? ' target="_blank" rel="noopener"' : ''}>
      <span class="ic"><i class="${icon}" aria-hidden="true"></i></span>
      <span class="tx"><b>${esc(label)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>
      <i class="go ph-fill ph-arrow-up-right" aria-hidden="true"></i>
    </a>`;

  // ── Reel: plays in the card like the phone page — a muted loop (the Preview
  // clip if set, else the reel); tap = sound from the start. Lite mode, data-saver
  // and reduced motion keep a still cover. Rebuilt only when the reel changes.
  let reelKey = '';
  function renderReel(d) {
    const reel = (d.watchReel && d.watchReel.url) ? d.watchReel : d.reel || {};
    const key = JSON.stringify([reel.url, reel.preview, reel.poster, reel.type]);
    if (key === reelKey) return;
    reelKey = key;
    const box = $('reel');
    box.hidden = !(reel.url && (reel.type || 'video') === 'video');
    if (box.hidden) return;
    box.classList.remove('playing', 'still');
    box.innerHTML = `<video id="reel-video" playsinline></video>
      <button type="button" class="play" id="reel-play"><b><i class="ph-fill ph-play"></i></b> <span>Watch the reel</span> <span id="reel-len"></span></button>`;
    const v = $('reel-video');
    const preview = !stillVideos();
    if (reel.poster) v.poster = media(reel.poster);
    if (preview) {
      v.src = media(reel.preview || reel.url); v.muted = true; v.loop = true; v.autoplay = true; v.preload = 'auto';
      v.play().catch(() => {});
    } else {
      box.classList.add('still'); v.src = media(reel.url) + (reel.poster ? '' : '#t=4'); v.preload = 'metadata';
    }
    const len = el => { const s = Math.round(el.duration); if (s) $('reel-len').textContent = `· ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    if (!reel.preview) v.addEventListener('loadedmetadata', () => len(v));
    else { const m = document.createElement('video'); m.preload = 'metadata'; m.src = media(reel.url); m.addEventListener('loadedmetadata', () => len(m)); }
    $('reel-play').addEventListener('click', () => {
      box.classList.add('playing'); box.classList.remove('still');
      if (reel.preview || !v.muted) v.src = media(reel.url);
      v.muted = false; v.loop = false; v.currentTime = 0; v.controls = true;
      v.play().catch(() => {});
    });
  }

  // ── Everything from content.json; runs at load, and again with the editor's
  // unsaved content when this page is its live preview (?preview) ──
  function render(d) {
    setRefContext(d);
    renderLegal(d, $('legal-card'));

    // Colours from Site settings → Theme (same set as the main site; --card = panel background)
    const t = d.theme || {};
    applyThemeVars(t);
    if (t.panelBg) document.documentElement.style.setProperty('--card', t.panelBg);

    // Name: first word, then the rest in accent italics — like the phone hero
    const [first, ...rest] = String(d.name || 'Run Girl Run').split(' ');
    $('name').innerHTML = `${esc(first)}<br><em>${esc(rest.join(' '))}</em>`;
    $('role').textContent = d.role || '';
    $('where').textContent = d.location || '';
    const av = d.availability || {};
    $('avail').hidden = !av.enabled;
    document.querySelector('#avail span').textContent = av.text || '';
    if (d.logo && $('dog').getAttribute('src') !== media(d.logo)) $('dog').src = media(d.logo);   // the site's Logo setting

    renderReel(d);

    const lp = d.linksPage || {};
    // Extra links (editor → Links page → Extra links)
    const extra = (lp.extra || []).filter(l => l && l.label && l.url);
    $('extra-group').hidden = !extra.length;
    $('extra-title').textContent = lp.extraTitle || 'Featured';
    $('extra').innerHTML = extra.map(l => {
      const url = resolveLinkUrl(l.url, d);
      return row({ label: l.label, sub: l.sub, url: /^(https?:|mailto:)/.test(url) ? url : media(url), icon: phosphorIcon(url) || 'ph-fill ph-link', main: true });
    }).join('');

    $('work').innerHTML = [
      { label: 'Portfolio', sub: lp.portfolioSub || 'Animation, projects & process', url: '../', icon: 'ph-fill ph-film-strip', main: true },
      { label: '3D modelling', sub: lp.modellingSub || 'Characters & props in 3D', url: '../modelling/', icon: 'ph-fill ph-cube', main: true },
      d.contact && d.contact.resume && { label: 'Résumé', sub: lp.resumeSub || 'PDF', url: media(d.contact.resume), icon: 'ph-fill ph-file-text', main: true },
    ].filter(Boolean).map(row).join('');

    // Socials: the ones ticked "Links page"
    const links = ((d.contact && d.contact.links) || []).filter(l => l.url && showsOn(l, 'links'))
      .map(l => ({ ...l, url: resolveLinkUrl(l.url, d) }));
    const substack = links.find(l => /substack\.com/.test(l.url));
    $('writing-group').hidden = !substack;
    $('writing').innerHTML = substack
      ? row({ label: substack.label || 'Substack', sub: lp.writingSub || 'Notes from the studio', url: substack.url, icon: 'ph-fill ph-article' }) : '';
    $('icons').innerHTML = links
      .filter(l => !l.url.startsWith('mailto:') && l !== substack)
      .map(l => {
        const studio = /studio/i.test(l.label || '');
        return `<a href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="${esc(l.label || handle(l.url))}" title="${esc(l.label || '')} — ${esc(handle(l.url))}">` +
          `<i class="${phosphorIcon(l.url) || 'ph-fill ph-link'}" aria-hidden="true"></i>${studio ? '<span class="tag" aria-hidden="true">studio</span>' : ''}</a>`;
      }).join('');

    const email = (d.contact && d.contact.email) || '';
    $('mail').hidden = !email;
    $('mail-link').href = 'mailto:' + email;
    $('mail-link').textContent = email;
    $('copy').onclick = async e => {
      try { await navigator.clipboard.writeText(email); e.target.textContent = 'Copied'; }
      catch (_) { e.target.textContent = 'Press & hold'; }
      setTimeout(() => (e.target.textContent = 'Copy'), 1600);
    };
  }

  initLegalModal();
  pauseVideosWhenIdle();
  const content = await liveFetch('content.json', '../content.json').then(r => r.json());
  render(content);
  const pageBg = initPageBg(content);
  initFlip(content, pageBg);

  // ── The hero reel, frosted, behind the whole page ──
  function initPageBg(d) {
    const reel = d.reel || {};
    const box = document.createElement('div'); box.className = 'page-bg'; box.setAttribute('aria-hidden', 'true');
    if (!stillVideos() && reel.url) {
      const v = Object.assign(document.createElement('video'), { muted: true, loop: true, autoplay: true, playsInline: true });
      v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
      v.src = media(reel.url); box.append(v); v.play().catch(() => {});
    } else if (reel.poster) {
      box.innerHTML = `<img alt="" src="${esc(media(reel.poster))}">`;
    } else return;
    document.body.prepend(box);
    document.body.classList.add('bg-video');
    return true;
  }

  // ── The back side: the QR ─────────────────────────────────────────────────
  function initFlip(d, pageBg) {
    const flipper = $('flipper'), front = $('front'), frontIn = $('front-in'), back = $('back');
    const PAGE_URL = 'https://rungirlrun.studio/links';

    // White QR (same build as /joanna-lina: 29×29, ECL Q, 9×9 clear centre), no background
    const q = qrcode(0, 'Q'); q.addData(PAGE_URL); q.make();
    const n = q.getModuleCount(), m = 2, size = n + m * 2;
    const hole = Math.round(n * 0.3) | 1, h0 = (n - hole) / 2;
    const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
    const inHole = (r, c) => r >= h0 - .5 && r < h0 + hole - .5 && c >= h0 - .5 && c < h0 + hole - .5;
    let dots = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (q.isDark(r, c) && !finder(r, c) && !inHole(r, c)) dots += `<rect x="${c + m + .04}" y="${r + m + .04}" width=".92" height=".92" rx=".3"/>`;
    const eye = (r, c) => `<rect x="${c + m + .5}" y="${r + m + .5}" width="6" height="6" rx="1.8" fill="none" stroke="#fff" stroke-width="1"/>` +
                          `<rect x="${c + m + 2}" y="${r + m + 2}" width="3" height="3" rx=".9" fill="#fff"/>`;
    const D = size * Math.SQRT2, o = (size - D) / 2, c = size / 2;          // the turned square's box
    $('qr').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${o} ${o} ${D} ${D}"><g transform="rotate(45 ${c} ${c})"><g fill="#fff">${dots}</g>${eye(0, 0)}${eye(0, n - 7)}${eye(n - 7, 0)}</g></svg>`;
    const dog = $('qr-dog');
    dog.src = media(d.logo || 'media/doog_loop-smoller.png');           // the logo is already white
    dog.style.width = (0.7071 * (hole / size) * 0.9 * 100).toFixed(2) + '%';

    // Frosted hero reel behind the code (a still poster in lite mode / reduced motion)
    const reel = d.reel || {};
    let bgVideo = null;
    if (pageBg) { /* the page's own frosted reel shows through the glass — no second video */ }
    else if (!stillVideos() && (reel.preview || reel.url)) {
      bgVideo = Object.assign(document.createElement('video'), { muted: true, loop: true, playsInline: true, preload: 'none' });
      bgVideo.setAttribute('muted', ''); bgVideo.setAttribute('playsinline', '');
      bgVideo.src = media(reel.preview || reel.url);
      back.prepend(bgVideo);
    } else if (reel.poster) {
      back.insertAdjacentHTML('afterbegin', `<img class="still" alt="" src="${esc(media(reel.poster))}">`);
    }

    // Height: the front's own height, or a square when flipped
    let flipped = false;
    const frontHeight = () => {
      const cs = getComputedStyle(front);
      return frontIn.offsetHeight + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
    };
    // The back's side: the card's width, or the screen's height if that's shorter
    // The square: the card's full width, or the screen's height if that's shorter
    // (landscape phones)
    const stage = flipper.parentElement;
    const side = () => Math.min(stage.offsetWidth, (visualViewport ? visualViewport.height : innerHeight) - 32);
    // The front's content keeps its full width while the card narrows — the card crops it
    const lockFront = () => {
      const cs = getComputedStyle(front);
      const w = stage.offsetWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - parseFloat(cs.borderLeftWidth) - parseFloat(cs.borderRightWidth);
      frontIn.style.width = w + 'px';
      frontIn.style.marginLeft = `calc((100% - ${w}px) / 2)`;
    };
    const size_ = () => {
      lockFront();
      flipper.style.width = flipped ? side() + 'px' : '';
      flipper.style.height = (flipped ? side() : frontHeight()) + 'px';
    };
    new ResizeObserver(size_).observe(frontIn);
    addEventListener('resize', size_);
    if (window.visualViewport) visualViewport.addEventListener('resize', size_);
    size_();

    const setAngle = a => flipper.style.setProperty('--a', a + 'deg');
    // Which side faces the viewer: read from the card's real, mid-animation angle
    // (cos < 0 = past edge-on), so the swap lands exactly when the card is side-on
    const facing = backFacing => flipper.classList.toggle('back-facing', backFacing);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let watch = 0, fallback = 0;
    function followTurn() {
      cancelAnimationFrame(watch); clearTimeout(fallback);
      if (reduced.matches) return facing(flipped);                       // crossfade, no turn
      const until = performance.now() + 1200;
      const tick = () => {
        facing(new DOMMatrix(getComputedStyle(flipper).transform).m11 < 0);
        if (performance.now() < until) watch = requestAnimationFrame(tick); else facing(flipped);
      };
      tick();
      fallback = setTimeout(() => facing(flipped), 1300);                // if frames are paused
    }
    const timing = (t, ease) => { flipper.style.setProperty('--t', t); flipper.style.setProperty('--ease', ease); };
    // The card keeps turning the way it's pushed, so the angle just adds up in half
    // turns (0, 180, 360, -180…) — an odd number of half turns is the back
    let rest = 0;
    // Focus only moves when the keyboard did the flipping (Enter on the dog, Escape) —
    // moved after a tap or swipe, phones draw a focus ring on the dog
    function flip(to, dir = 1, byKeyboard = false) {
      if (to === flipped) return;
      flipped = to;
      rest += 180 * dir;
      flipper.classList.toggle('flipped', to);
      setAngle(rest);
      followTurn();
      size_();
      front.inert = to; back.inert = !to;
      document.documentElement.classList.toggle('qr-up', to);
      if (bgVideo) to ? bgVideo.play().catch(() => {}) : setTimeout(() => !flipped && bgVideo.pause(), 800);
      if (byKeyboard) (to ? back : $('flip-open')).focus({ preventScroll: true });
    }
    // Opening from further down the page: glide to the top first, then turn
    $('flip-open').addEventListener('click', e => {
      timing('', '');
      const kb = e.detail === 0;                                        // Enter/Space, not a tap
      if (scrollY < 4) return flip(true, 1, kb);
      scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => flip(true, 1, kb), 380);
    });
    addEventListener('keydown', e => { if (e.key === 'Escape' && flipped) { timing('', ''); flip(false, 1, true); } });

    // Swipe sideways to turn the card, either way, on either side. It follows the
    // finger; past a third of the width (or a flick) it turns over. On the front only
    // a finger counts (a mouse drag there is for selecting text) and up/down still
    // scrolls; with the back up, anywhere on screen works, mouse too.
    let drag = null, dragged = false;
    addEventListener('pointerdown', e => {
      dragged = false;
      if (e.target.closest('#legal-modal')) return;
      if (!flipped && (e.pointerType === 'mouse' || !e.target.closest('#front'))) return;
      drag = { x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, on: false };
    });
    addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.on) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if (Math.abs(dx) < Math.abs(dy) * 1.2) { drag = null; return; }   // that's a scroll
        drag.on = true; dragged = true; flipper.classList.add('dragging');
      }
      drag.dx = dx;
      const a = rest + Math.max(-180, Math.min(180, dx / flipper.offsetWidth * 180));
      setAngle(a);
      if (!reduced.matches) facing(Math.cos(a * Math.PI / 180) < 0);
    });
    const release = () => {
      const d = drag; drag = null;
      if (!d || !d.on) return;
      flipper.classList.remove('dragging');
      setTimeout(() => (dragged = false), 60);                          // only the click right after
      const w = flipper.offsetWidth, dist = Math.abs(d.dx);
      const fast = dist / (performance.now() - d.t) > 0.5;              // a flick also counts
      const go = dist > w / 3 || (fast && dist > 24);
      // Carry on from where the finger let go: ease-out, timed to the turn left
      const done = Math.min(1, dist / w);
      timing((0.15 + 0.5 * (go ? 1 - done : done)).toFixed(2) + 's', 'cubic-bezier(.2,.75,.3,1)');
      if (go) flip(!flipped, Math.sign(d.dx)); else { setAngle(rest); followTurn(); }
    };
    addEventListener('pointerup', release);
    addEventListener('pointercancel', release);
    // A swipe that started on a link shouldn't also open it
    addEventListener('click', e => { if (dragged) { e.preventDefault(); e.stopPropagation(); dragged = false; } }, true);
  }

  // As the editor's preview: redraw with its unsaved content (same origin only)
  if (new URLSearchParams(location.search).has('preview')) {
    window.addEventListener('message', e => {
      if (e.origin === location.origin && e.data && e.data.type === 'rgr-links-preview' && e.data.content) render(e.data.content);
    });
    window.parent.postMessage({ type: 'rgr-links-preview-ready' }, location.origin);
  }
</script>
</body>
</html>
