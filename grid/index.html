<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render Grid</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../media/rgr_fav.png">
<style>
  :root { --bg:#1e1e1e; --panel:#2a2a2a; --line:#3a3a3a; --text:#ddd; --dim:#999; --accent:#4c8dff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
           padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  label { display:flex; gap:6px; align-items:center; color:var(--dim); }
  input[type=number] { width:64px; }
  input[type=text] { width:170px; }
  input, select, button { background:#111; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 6px; font:inherit; }
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button.main { background:var(--accent); border-color:var(--accent); color:#fff; }
  #info { margin-left:auto; color:var(--dim); }
  #info.bad { color:#ff7b7b; }
  main { padding:16px; }
  #drop { border:2px dashed var(--line); border-radius:8px; padding:28px; text-align:center; color:var(--dim); cursor:pointer; }
  body.dragging #drop { border-color:var(--accent); color:var(--text); }
  #list { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .thumb { position:relative; width:110px; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:4px; cursor:grab; }
  .thumb img { display:block; width:100%; height:70px; object-fit:contain; pointer-events:none; }
  .thumb i { display:block; height:70px; border:1px dashed var(--line); border-radius:2px; }
  .thumb span { display:block; font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thumb input { width:100%; margin-top:3px; padding:2px 4px; font-size:12px; }
  .thumb b { position:absolute; top:2px; right:4px; color:#ff7b7b; cursor:pointer; }
  .thumb.over { border-color:var(--accent); }
  #out { display:block; max-width:100%; cursor:grab; background:repeating-conic-gradient(#333 0 25%, #2a2a2a 0 50%) 0 0/20px 20px; }
</style>
</head>
<body>
<header>
  <label>Title <input id="title" type="text" placeholder="Sheet name"></label>
  <label>Subtitle <input id="subtitle" type="text" placeholder="by …"></label>
  <label>Columns <input id="cols" type="number" min="1" value="3"></label>
  <label>Gap px <input id="gap" type="number" min="0" value="0"></label>
  <label>Fit <select id="fit"><option value="contain">fit inside</option><option value="cover">fill (crop)</option></select></label>
  <label>Background <input id="bg" type="color" value="#000000"></label>
  <label><input id="transp" type="checkbox"> transparent</label>
  <label><input id="labels" type="checkbox" checked> names <select id="labelpos"><option value="on">on image</option><option value="below">below</option></select></label>
  <button id="blank">Add empty box</button>
  <button id="sort">Sort A–Z</button>
  <button id="clear">Clear</button>
  <label>Format <select id="fmt"><option value="webp">WebP</option><option value="png">PNG</option><option value="jpeg">JPG</option></select></label>
  <label>Quality <input id="quality" type="number" min="1" max="100" value="90"></label>
  <label>Size <select id="size"><option value="100">100%</option><option value="75">75%</option><option value="50">50%</option><option value="33">33%</option><option value="25">25%</option></select></label>
  <button id="copy" class="main">Copy</button>
  <button id="save" class="main">Save</button>
  <span id="info">No images</span>
</header>
<main>
  <div id="drop">Drop renders anywhere on this page (or click to pick). PNG / JPG / WebP. Drag images in the preview (or the thumbnails) to reorder.</div>
  <input id="pick" type="file" accept="image/*" multiple hidden>
  <div id="list"></div>
  <canvas id="out" width="0" height="0"></canvas>
</main>
<script>
const $ = id => document.getElementById(id);
const out = $("out"), ctx = out.getContext("2d");
const base = document.createElement("canvas");   // last clean preview, for drawing drag outlines over

// The preview is drawn from small copies of each render, so it stays fast.
// The full-size files are only read when you save, one at a time.
const PREVIEW_MAX = 2048;    // longest side of the preview canvas
const PREV_IMG_MAX = 1280;   // longest side of each render's preview copy
const THUMB_MAX = 220;

let items = [];              // { id, name, label, file, handle, w, h, prev (ImageBitmap), thumb (data URL), blank }
let dragFrom = null;         // index of the thumbnail being moved
let grid = null, cellFrom = null, pending = false, busy = false;
let restoring = true, checking = false, stateTimer = null, nextId = Date.now();

const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true });

// The session survives a closed tab: each render is copied into this browser's own storage, with the
// order, names and settings beside it. Nothing leaves this machine.
const SETTINGS = ["title", "subtitle", "cols", "gap", "fit", "bg", "transp", "labels", "labelpos", "fmt", "quality", "size"];
const DB = new Promise((res, rej) => {
  const q = indexedDB.open("render_grid", 1);
  q.onupgradeneeded = () => { q.result.createObjectStore("files"); q.result.createObjectStore("state"); };
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});
const inStore = (name, mode, fn) => DB.then(db => new Promise((res, rej) => {
  const t = db.transaction(name, mode), r = fn(t.objectStore(name));
  t.oncomplete = () => res(r.result);
  t.onerror = t.onabort = () => rej(t.error);
}));
function tooBigToKeep() {
  $("info").textContent += " — too big to keep if the tab closes";
  $("info").classList.add("bad");
}
const keepFile = it => inStore("files", "readwrite", s => s.put({ file: it.file, handle: it.handle }, it.id)).catch(tooBigToKeep);
const forgetFile = it => inStore("files", "readwrite", s => s.delete(it.id)).catch(() => {});

function saveState() {
  clearTimeout(stateTimer);
  stateTimer = setTimeout(() => {
    if (restoring) return;
    const settings = Object.fromEntries(SETTINGS.map(id => [id, $(id).type === "checkbox" ? $(id).checked : $(id).value]));
    const order = items.map(({ id, label, blank }) => ({ id, label, blank }));
    inStore("state", "readwrite", s => s.put({ settings, order }, "session")).catch(() => {});
  }, 250);
}

async function restore() {
  try {
    const saved = await inStore("state", "readonly", s => s.get("session"));
    if (!saved) return;
    for (const id of SETTINGS) {
      const v = saved.settings[id];
      if (v === undefined) continue;
      if ($(id).type === "checkbox") $(id).checked = v; else $(id).value = v;
    }
    if ($("fmt").selectedOptions[0]?.disabled) $("fmt").value = "png";
    for (const [i, { id, label, blank }] of saved.order.entries()) {
      $("info").textContent = `Restoring ${i + 1} / ${saved.order.length}…`;
      if (blank) { items.push(blankItem(id, label)); continue; }
      const rec = await inStore("files", "readonly", s => s.get(id));
      const it = rec && await loadItem(rec.file, rec.handle);
      if (it) items.push(Object.assign(it, { id, label }));
    }
    refresh();
    if (items.length) $("info").textContent = `Restored ${items.length} render${items.length === 1 ? "" : "s"} · ` + $("info").textContent;
  } catch {
    // no storage here (private window): the page just starts empty
  } finally {
    restoring = false;
  }
  updateFromDisk();
}

// the new render takes the old one's place, keeping its position and label
function swapIn(it, fresh) {
  it.prev.close();
  // the handle goes too: a render dropped from elsewhere must not be undone by the old file on disk
  Object.assign(it, { file: fresh.file, handle: fresh.handle, w: fresh.w, h: fresh.h, prev: fresh.prev, thumb: fresh.thumb });
  keepFile(it);
}

// re-export over a file and it's picked up when you come back to this tab, or when you save
async function updateFromDisk() {
  if (checking || busy || restoring) return;
  checking = true;
  let n = 0;
  for (const it of [...items]) {
    if (!it.handle) continue;
    try {
      if (await it.handle.queryPermission({ mode: "read" }) !== "granted") continue;
      const f = await it.handle.getFile();
      if (f.lastModified === it.file.lastModified && f.size === it.file.size) continue;
      const fresh = await loadItem(f, it.handle);
      if (fresh && items.includes(it)) { swapIn(it, fresh); n++; }
      else if (fresh) fresh.prev.close();
    } catch {
      // moved, or Blender is still writing it: left as it is, tried again next time
    }
  }
  checking = false;
  if (n) { refresh(); $("info").textContent = `Updated ${n} · ` + $("info").textContent; }
}

// an empty box: holds a place in the grid, and can carry a name as a section heading
const blankItem = (id, label = "") => ({ id, name: "", label, file: null, handle: null, w: 0, h: 0, prev: null, thumb: "", blank: true });

async function loadItem(f, handle = null) {
  try {
    const full = await createImageBitmap(f);
    const w = full.width, h = full.height;
    const r = Math.min(1, PREV_IMG_MAX / Math.max(w, h));
    const prev = r < 1
      ? await createImageBitmap(full, { resizeWidth: Math.round(w * r), resizeHeight: Math.round(h * r), resizeQuality: "high" })
      : full;
    const t = Math.min(1, THUMB_MAX / Math.max(w, h)), c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * t)); c.height = Math.max(1, Math.round(h * t));
    c.getContext("2d").drawImage(prev, 0, 0, c.width, c.height);
    if (prev !== full) full.close();
    // label starts as the file name without its extension; edit it under the thumbnail
    return { name: f.name, label: f.name.replace(/\.[^.]+$/, ""), file: f, handle, w, h, prev, thumb: c.toDataURL("image/png") };
  } catch {
    return null;
  }
}

// files: File objects, or { file, handle } where the browser gave a way back to the file on disk
async function addFiles(files) {
  const all = [...files].map(f => f instanceof File ? { file: f, handle: null } : f).filter(p => p.file);
  const imgs = all.filter(p => p.file.type.startsWith("image/"));
  const skipped = all.filter(p => !imgs.includes(p)).map(p => p.file.name);
  const had = new Map(items.map(it => [it.name, it]));   // same name as one already here = its new version
  const fresh = [];
  let replaced = 0;
  for (const [i, { file, handle }] of imgs.entries()) {          // one at a time, so big batches don't eat all the memory
    $("info").textContent = `Loading ${i + 1} / ${imgs.length}…`;
    const it = await loadItem(file, (await handle) || null);
    if (!it) { skipped.push(file.name); continue; }
    if (had.has(it.name)) { swapIn(had.get(it.name), it); replaced++; }
    else { it.id = String(nextId++); keepFile(it); fresh.push(it); }
  }
  fresh.sort(byName);
  if (!items.length) $("cols").value = Math.ceil(Math.sqrt(fresh.length)) || 1;
  items.push(...fresh);
  refresh();
  if (replaced) $("info").textContent = `Replaced ${replaced} · ` + $("info").textContent;
  if (skipped.length) {
    const shown = skipped.slice(0, 3).join(", ") + (skipped.length > 3 ? ` +${skipped.length - 3} more` : "");
    $("info").textContent = `Skipped ${skipped.length} (PNG / JPG / WebP only): ${shown}`;
    $("info").classList.add("bad");
  }
}

function refresh() { drawList(); render(); }
function requestRender() { if (!pending) { pending = true; requestAnimationFrame(render); } }

function drawList() {
  const list = $("list");
  list.innerHTML = "";
  items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "thumb"; d.draggable = true; d.title = it.name;
    d.innerHTML = `${it.blank ? "<i></i>" : `<img src="${it.thumb}">`}<span></span><input title="Name shown on the image"><b title="Remove">✕</b>`;
    d.querySelector("span").textContent = `${i + 1}. ${it.blank ? "empty box" : it.name}`;   // as text: a file name is never page code
    const name = d.querySelector("input");
    name.value = it.label;
    name.oninput = () => { it.label = name.value; requestRender(); };
    name.onfocus = () => { d.draggable = false; };   // let you select text instead of dragging the card
    name.onblur = () => { d.draggable = true; };
    d.querySelector("b").onclick = () => { it.prev?.close(); forgetFile(it); items.splice(i, 1); refresh(); };
    d.ondragstart = e => { dragFrom = i; e.dataTransfer.effectAllowed = "move"; };
    d.ondragover = e => { if (dragFrom !== null) { e.preventDefault(); d.classList.add("over"); } };
    d.ondragleave = () => d.classList.remove("over");
    d.ondrop = e => {
      if (dragFrom === null) return;
      e.preventDefault(); e.stopPropagation();
      items.splice(i, 0, items.splice(dragFrom, 1)[0]);
      dragFrom = null; refresh();
    };
    d.ondragend = () => { dragFrom = null; };
    list.appendChild(d);
  });
}

// grid size in pixels at 100%; Size % scales the whole thing (gap and names too) when saving
function layout() {
  const n = items.length;
  const cols = Math.min(Math.max(1, +$("cols").value || 1), n);
  const rows = Math.ceil(n / cols);
  const gap = Math.max(0, +$("gap").value || 0);
  // every cell is the size of the largest render
  const cw = Math.max(1, ...items.map(it => it.w));
  const ch = Math.max(1, ...items.map(it => it.h));
  const fs = Math.max(12, Math.round(ch * 0.035));                                   // names
  const lh = $("labels").checked && $("labelpos").value === "below" ? Math.ceil(fs * 1.8) : 0;   // strip under each cell
  const title = $("title").value.trim(), subtitle = $("subtitle").value.trim();
  const tf = Math.max(20, Math.round(ch * 0.07)), sf = Math.max(12, Math.round(ch * 0.03)), tp = Math.round(tf * 0.5);
  const th = title || subtitle ? Math.ceil(tp * 2 + (title ? tf * 1.25 : 0) + (subtitle ? sf * 1.25 : 0)) : 0;   // band on top
  const W = cols * cw + (cols + 1) * gap, H = th + rows * (ch + lh) + (rows + 1) * gap;
  const s = +$("size").value / 100, sw = Math.round(W * s), sh = Math.round(H * s);
  return { n, cols, rows, cw, ch, gap, fs, lh, title, subtitle, tf, sf, tp, th, W, H, s, sw, sh,
           tooBig: sw > 16384 || sh > 16384 || sw * sh > 268e6 };
}

const cellX = (g, i) => g.gap + (i % g.cols) * (g.cw + g.gap);
const cellY = (g, i) => g.th + g.gap + Math.floor(i / g.cols) * (g.ch + g.lh + g.gap);

// black or white, whichever reads on the background colour
function ink() {
  const v = parseInt($("bg").value.slice(1), 16);
  return 0.299 * (v >> 16) + 0.587 * (v >> 8 & 255) + 0.114 * (v & 255) > 140 ? "#000" : "#fff";
}

// k = canvas pixels per output pixel (1 when saving, smaller for the preview)
function drawBackground(c, g, k, forceFill) {
  c.clearRect(0, 0, g.W * k, g.H * k);
  if (forceFill || !$("transp").checked) { c.fillStyle = $("bg").value; c.fillRect(0, 0, g.W * k, g.H * k); }
}

function drawTitle(c, g, k) {
  if (!g.th) return;
  const x = g.tp * k;
  let y = g.tp * k;
  c.fillStyle = ink();
  c.textBaseline = "top";
  if (g.title) { c.font = `bold ${g.tf * k}px sans-serif`; c.fillText(g.title, x, y); y += g.tf * 1.25 * k; }
  if (g.subtitle) { c.font = `300 ${g.sf * k}px "Helvetica Neue", "Segoe UI", sans-serif`; c.fillText(g.subtitle, x, y); }
}

function drawCell(c, g, k, it, i, src) {
  const x = cellX(g, i) * k, y = cellY(g, i) * k;
  const cw = g.cw * k, ch = g.ch * k;
  if (src) {
    c.save();
    c.beginPath(); c.rect(x, y, cw, ch); c.clip();
    c.imageSmoothingQuality = "high";
    const r = ($("fit").value === "cover" ? Math.max : Math.min)(cw / it.w, ch / it.h);
    const dw = it.w * r, dh = it.h * r;
    c.drawImage(src, x + (cw - dw) / 2, y + (ch - dh) / 2, dw, dh);
    c.restore();
  }
  if ($("labels").checked && it.label) {
    const fs = g.fs * k, pad = fs * 0.4;
    c.save();
    c.beginPath(); c.rect(x, y, cw, ch + g.lh * k); c.clip();
    c.font = `${fs}px sans-serif`;
    c.textBaseline = "top";
    if (g.lh) {   // in the strip under the image
      c.fillStyle = ink();
      c.fillText(it.label, x + pad, y + ch + pad);
    } else {      // black box in the top-left corner, white name on it
      c.fillStyle = "#000";
      c.fillRect(x, y, Math.ceil(c.measureText(it.label).width + pad * 2), fs + pad * 2);
      c.fillStyle = "#fff";
      c.fillText(it.label, x + pad, y + pad);
    }
    c.restore();
  }
}

function render() {
  pending = false;
  if (busy) return;
  saveState();
  const info = $("info");
  info.classList.remove("bad");
  if (!items.length) { out.width = out.height = 0; grid = null; info.textContent = "No images"; return; }

  const g = grid = layout();
  info.textContent = `${g.cols} × ${g.rows} grid · saves at ${g.sw} × ${g.sh} px`;
  if (g.tooBig) { info.textContent += " — too big to save, lower Size"; info.classList.add("bad"); }

  g.k = Math.min(1, PREVIEW_MAX / Math.max(g.W, g.H));
  out.width = Math.max(1, Math.round(g.W * g.k)); out.height = Math.max(1, Math.round(g.H * g.k));
  drawBackground(ctx, g, g.k);
  drawTitle(ctx, g, g.k);
  items.forEach((it, i) => drawCell(ctx, g, g.k, it, i, it.prev));

  base.width = out.width; base.height = out.height;
  base.getContext("2d").drawImage(out, 0, 0);
}

// drag cells on the preview to reorder
function cellAt(e) {
  const r = out.getBoundingClientRect(), { cols, rows, cw, ch, lh, th, gap, n, W, H } = grid;
  const px = (e.clientX - r.left) * W / r.width, py = (e.clientY - r.top) * H / r.height;
  const col = Math.min(cols - 1, Math.max(0, Math.floor((px - gap / 2) / (cw + gap))));
  const row = Math.min(rows - 1, Math.max(0, Math.floor((py - th - gap / 2) / (ch + lh + gap))));
  return Math.min(n - 1, row * cols + col);
}
function outline(i, color) {
  const { cw, ch, k } = grid, lw = Math.max(3, Math.round(out.width / 300));
  ctx.lineWidth = lw; ctx.strokeStyle = color;
  ctx.strokeRect(cellX(grid, i) * k + lw / 2, cellY(grid, i) * k + lw / 2, cw * k - lw, ch * k - lw);
}
function showDrag(to) {   // the clean preview plus outlines, without redrawing the renders
  ctx.clearRect(0, 0, out.width, out.height);
  ctx.drawImage(base, 0, 0);
  outline(cellFrom, "#4c8dff");
  if (to !== cellFrom) outline(to, "#ffcc00");
}
out.addEventListener("pointerdown", e => {
  if (!grid || busy) return;
  cellFrom = cellAt(e);
  out.setPointerCapture(e.pointerId);
  out.style.cursor = "grabbing";
  showDrag(cellFrom);
});
out.addEventListener("pointermove", e => { if (cellFrom !== null) showDrag(cellAt(e)); });
out.addEventListener("pointerup", e => {
  if (cellFrom === null) return;
  const to = cellAt(e);
  if (to !== cellFrom) items.splice(to, 0, items.splice(cellFrom, 1)[0]);
  cellFrom = null; out.style.cursor = "";
  refresh();   // redraws clean, without the outlines
});

// drop files anywhere on the page
addEventListener("dragover", e => { if (e.dataTransfer.types.includes("Files")) { e.preventDefault(); document.body.classList.add("dragging"); } });
addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
addEventListener("drop", e => {
  document.body.classList.remove("dragging");
  if (!e.dataTransfer.files.length) return;
  e.preventDefault();
  // the handles have to be asked for now: the drop's data is gone once this event ends
  addFiles([...e.dataTransfer.items].filter(i => i.kind === "file")
    .map(i => ({ file: i.getAsFile(), handle: i.getAsFileSystemHandle ? i.getAsFileSystemHandle() : null })));
});
$("drop").onclick = async () => {
  if (!window.showOpenFilePicker) return $("pick").click();
  try {
    const handles = await showOpenFilePicker({ multiple: true, types: [{ description: "Images", accept: { "image/*": [".png", ".jpg", ".jpeg", ".webp"] } }] });
    addFiles(await Promise.all(handles.map(async handle => ({ file: await handle.getFile(), handle }))));
  } catch (err) {
    if (err.name !== "AbortError") $("pick").click();
  }
};
$("pick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };

["title", "subtitle", "cols", "gap", "size", "fit", "bg", "transp", "labels", "labelpos"].forEach(id => $(id).addEventListener("input", requestRender));
["fmt", "quality"].forEach(id => $(id).addEventListener("input", saveState));
$("blank").onclick = () => { items.push(blankItem(String(nextId++))); refresh(); };
$("sort").onclick = () => {   // empty boxes go to the end
  items = [...items.filter(it => !it.blank).sort(byName), ...items.filter(it => it.blank)];
  refresh();
};
$("clear").onclick = () => {
  items.forEach(it => it.prev?.close());
  items = [];
  inStore("files", "readwrite", s => s.clear()).catch(() => {});
  refresh();
};
addEventListener("focus", updateFromDisk);

// the finished sheet at full size. Used by Save and Copy.
async function buildBlob(type, quality, opaque) {
  await updateFromDisk();   // so a sheet never uses a render that's been replaced since
  const g = layout(), info = $("info");
  info.classList.remove("bad");
  busy = true; $("save").disabled = $("copy").disabled = true;
  const c = document.createElement("canvas");
  try {
    c.width = g.sw; c.height = g.sh;
    const cx = c.getContext("2d");
    drawBackground(cx, g, g.s, opaque);
    drawTitle(cx, g, g.s);
    for (const [i, it] of items.entries()) {
      info.textContent = `Drawing ${i + 1} / ${items.length}…`;
      const full = it.blank ? null : await createImageBitmap(it.file);   // full size, read only now and freed straight after
      drawCell(cx, g, g.s, it, i, full);
      full?.close();
    }
    info.textContent = "Encoding…";
    const blob = await new Promise(res => c.toBlob(res, type, quality));
    if (!blob) throw new Error("the browser couldn't encode the image");
    return blob;
  } finally {
    busy = false; $("save").disabled = $("copy").disabled = false;
    c.width = c.height = 0;   // free the full-size canvas
  }
}

const sizeText = b => b < 1048576 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1048576).toFixed(1)} MB`;

function failed(err, what) {
  render();
  $("info").textContent = `${what} failed: ${err.message}`;
  $("info").classList.add("bad");
}

// PNG, the one image format the clipboard takes everywhere
$("copy").onclick = async () => {
  if (!items.length || busy) return;
  if (layout().tooBig) { alert("The grid is too big for the browser to copy. Lower Size."); return; }
  if (!navigator.clipboard?.write || !window.ClipboardItem) { failed(new Error("this browser can't copy images"), "Copy"); return; }
  // the blob goes in as a promise, so the browser still counts this as your click while it's drawn
  const blob = buildBlob("image/png", undefined, false);
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    const size = (await blob).size;
    render();
    $("info").textContent = `Copied · ${layout().sw} × ${layout().sh} px · ${sizeText(size)}`;
  } catch (err) {
    await blob.catch(() => {});   // let the drawing finish, so its progress text can't cover the error
    failed(err, "Copy");
  }
};

$("save").onclick = async () => {
  if (!items.length || busy) return;
  const g = layout(), info = $("info");
  const fmt = $("fmt").value, type = "image/" + fmt, ext = fmt === "jpeg" ? ".jpg" : "." + fmt;
  const quality = Math.min(100, Math.max(1, +$("quality").value || 90)) / 100;   // PNG ignores it
  if (g.tooBig) { alert("The grid is too big for the browser to save. Lower Size."); return; }
  if (fmt === "webp" && (g.sw > 16383 || g.sh > 16383)) {
    alert("WebP can't go past 16383 px on a side. Lower Size or save as PNG/JPG.");
    return;
  }
  // ask for the folder and name first, so the picker opens straight away
  let handle = null;
  if (window.showSaveFilePicker) {
    try {
      handle = await showSaveFilePicker({
        suggestedName: "render_grid" + ext,
        types: [{ description: fmt.toUpperCase() + " image", accept: { [type]: [ext] } }],
      });
    } catch (err) {
      if (err.name === "AbortError") return;   // cancelled
    }
  }

  try {
    const blob = await buildBlob(type, quality, fmt === "jpeg");   // JPG has no transparency
    if (handle) {
      const w = await handle.createWritable();
      await w.write(blob); await w.close();
    } else {   // browsers without a save dialog: normal download
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "render_grid" + ext;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    render();
    info.textContent = `Saved ${handle ? handle.name : "render_grid" + ext} · ${sizeText(blob.size)}`;
  } catch (err) {
    failed(err, "Save");
  }
};

// a browser that can't write WebP would quietly hand back a PNG under that name
const probe = document.createElement("canvas");
probe.width = probe.height = 1;
if (!probe.toDataURL("image/webp").startsWith("data:image/webp")) {
  const webp = $("fmt").querySelector('[value="webp"]');
  webp.disabled = true;
  webp.textContent = "WebP (not in this browser)";
  $("fmt").value = "png";
}

restore();
</script>
</body>
</html>
