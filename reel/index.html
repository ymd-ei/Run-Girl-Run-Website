<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Share link for the demo reel: rungirlrun.studio/reel/
     Plays whatever is set as the Watch Reel video in content.json (editor → Home → Watch reel),
     so it stays current without editing this page. -->
<title>Demo Reel — Run Girl Run</title>
<meta name="description" content="Demo reel — 3D character animation by Run Girl Run, Toronto.">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://rungirlrun.studio/reel/">
<meta property="og:site_name" content="Run Girl Run">
<meta property="og:title" content="Demo Reel — Run Girl Run">
<meta property="og:description" content="3D character animation out of Toronto.">
<meta property="og:image" content="https://rungirlrun.studio/media/jammeratoast%20jammers.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Demo Reel — Run Girl Run">
<meta name="twitter:description" content="3D character animation out of Toronto.">
<meta name="twitter:image" content="https://rungirlrun.studio/media/jammeratoast%20jammers.png">
<link rel="canonical" href="https://rungirlrun.studio/reel/">
<link rel="icon" href="../media/rgr_fav.png">
<link rel="apple-touch-icon" href="../media/rgr_fav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1714;--paper:#f2ede4;--paper-rgb:242,237,228;--accent:#5e30eb;
    --font-s:'Cormorant Garamond',serif;--font-b:'DM Sans',sans-serif}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--ink);color:var(--paper);font-family:var(--font-b);font-weight:300;
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  header,footer{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
    padding:1.1rem clamp(1rem,3vw,2rem)}
  .name{font-family:var(--font-s);font-size:1.4rem;font-weight:700;color:var(--paper);text-decoration:none;letter-spacing:.01em}
  .name em{font-weight:400}
  .label{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(var(--paper-rgb),.5)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 clamp(1rem,3vw,2rem)}
  .player{width:100%;max-width:min(1400px,calc((100dvh - 9rem) * 16 / 9));aspect-ratio:16/9;background:#000}
  .player video,.player iframe{display:block;width:100%;height:100%;border:0;background:#000}
  .msg{font-size:.85rem;color:rgba(var(--paper-rgb),.6);text-align:center;padding:2rem}
  footer{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;flex-wrap:wrap}
  footer a{color:rgba(var(--paper-rgb),.6);text-decoration:none;transition:color .2s}
  footer a:hover,footer a:focus-visible{color:var(--paper)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .links{display:flex;gap:1.5rem;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <a class="name" href="../">Run <em>Girl</em> Run</a>
  <span class="label">Demo Reel</span>
</header>
<main>
  <div class="player" id="player"><p class="msg">Loading reel…</p></div>
</main>
<footer>
  <span class="label">3D Character Animation · Toronto</span>
  <span class="links">
    <a id="email" href="mailto:contact@rungirlrun.studio">contact@rungirlrun.studio</a>
    <a id="resume" href="../resume/" target="_blank" rel="noopener" hidden>Resume ↗</a>
    <a href="../">Full portfolio →</a>
  </span>
</footer>
<script>
(async () => {
  const player = document.getElementById('player');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  try {
    const { liveFetch } = await import('../src/utils/liveContent.js');   // seconds-fresh after an editor save
    const data = await liveFetch('content.json', '../content.json').then(r => r.json());
    const reel = (data.watchReel && data.watchReel.url) ? data.watchReel : data.reel;
    if (!reel || !reel.url) throw new Error('no reel');

    const email = data.contact && data.contact.email;
    if (email) { const a = document.getElementById('email'); a.href = 'mailto:' + email; a.textContent = email; }
    const resume = data.contact && data.contact.resume;
    if (resume) {
      const a = document.getElementById('resume');
      a.href = /^(https?:)?\/\//.test(resume) ? resume : '../' + encodeURI(resume);
      a.hidden = false;
    }

    if (reel.type === 'youtube' || reel.type === 'vimeo') {
      // Same cleanup as the site's lightbox: show controls, don't force mute/background mode.
      let src = reel.url.replace(/[&?]controls=0/, '').replace(/[&?]mute(d)?=1/g, '').replace('background=1', 'background=0');
      player.innerHTML = `<iframe src="${esc(src)}" title="Demo reel" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    } else {
      // Media paths in content.json are relative to the site root, one level up from here.
      const url = /^(https?:)?\/\//.test(reel.url) ? reel.url : '../' + encodeURI(reel.url);
      const poster = reel.poster ? ` poster="${esc(/^(https?:)?\/\//.test(reel.poster) ? reel.poster : '../' + encodeURI(reel.poster))}"` : '';
      player.innerHTML = `<video src="${esc(url)}"${poster} controls loop playsinline preload="metadata" aria-label="Demo reel"></video>`;
    }
  } catch (e) {
    player.innerHTML = '<p class="msg">The reel couldn’t load here — <a href="../" style="color:inherit">watch it on the main site</a>.</p>';
  }
})();
</script>
</body>
</html>
