<head>

<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#2a2622">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" id="favicon" href="media/rgr_fav.png">
<link rel="apple-touch-icon" href="media/app-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">

<link rel="stylesheet" href="styles-screens.css?v=3">
<link rel="stylesheet" href="styles-mobile.css?v=50">

<body data-tab="home">

<!-- The phone site, as an app (src/display/mobile.js), in the /links card: the card
     floats over the frosted reel with four tabs under it. Each tab keeps its own
     stack of screens inside the card; projects, posts and Privacy & Legal slide in
     over the tab they were opened from (swipe right, or Back, to go back). Contact
     is the card's back: it turns over. -->
<div id="app">
  <main id="tabs">

    <section class="tab on" id="tab-home" aria-label="Home">
      <div class="screen root">
        <header class="bar">
          <span class="dog"><img id="dog" src="media/doog_loop-smoller.png" alt=""></span>
          <span class="avail" id="avail" hidden><i></i><span></span></span>
        </header>
        <div class="scroll">
          <div class="home-top">
            <p class="role" id="role">3D Animator</p>
            <h1 id="name">Run<br><em>Girl Run</em></h1>
            <p class="where" id="where"></p>
          </div>
          <div class="reel" id="reel" hidden></div>
          <section class="shelf" id="shelf" hidden>
            <div class="shelf-head"><h2>Latest work</h2><button type="button" data-go="work">See all</button></div>
            <div class="shelf-row" id="shelf-row"></div>
          </section>
          <div class="links" id="rows"></div>
          <nav class="icons" id="icons" aria-label="Social links"></nav>
          <footer class="foot">
            <button type="button" class="lite-toggle" id="lite-toggle" aria-pressed="false"><span data-site-text="liteMode">Lite mode</span><span class="lite-switch" aria-hidden="true"></span></button>
            <button type="button" id="legal-open" data-site-text="legalLink">Privacy &amp; Legal</button>
          </footer>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-work" aria-label="Work" inert>
      <div class="screen root">
        <header class="bar"><span class="bar-title" data-site-text="navWork">Work</span></header>
        <div class="scroll" id="work-scroll">
          <h1 class="large" data-mark data-site-text="navWork">Work</h1>
          <div class="wf" id="work-filters"></div>
          <div class="wg" id="work-grid" data-cols="3"></div>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-about" aria-label="About" inert>
      <div class="screen root">
        <header class="bar"><span class="bar-title" data-site-text="navAbout">About</span></header>
        <div class="scroll">
          <h1 class="large" data-mark data-site-text="navAbout">About</h1>
          <div class="ppbody" id="about-body"></div>
        </div>
      </div>
    </section>

    <section class="tab dark" id="tab-contact" aria-label="Contact" inert>
      <div class="screen root">
        <header class="bar"><span class="bar-title">Contact</span></header>
        <div class="scroll">
          <h1 class="large ct-title" data-mark id="ct-title"></h1>
          <p class="ct-sub" id="ct-sub"></p>
          <div class="mail" id="mail" hidden>
            <i class="ph-fill ph-envelope" aria-hidden="true"></i>
            <a id="mail-link" href="#"></a>
            <button type="button" id="copy">Copy</button>
          </div>
          <nav class="icons" id="ct-icons" aria-label="Social links"></nav>
        </div>
      </div>
    </section>

  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button type="button" data-tab="home" aria-current="page"><i class="ph-fill ph-house" aria-hidden="true"></i><span>Home</span></button>
    <button type="button" data-tab="work"><i class="ph-fill ph-squares-four" aria-hidden="true"></i><span data-site-text="navWork">Work</span></button>
    <button type="button" data-tab="about"><i class="ph-fill ph-user" aria-hidden="true"></i><span data-site-text="navAbout">About</span></button>
    <button type="button" data-tab="contact"><i class="ph-fill ph-envelope-simple" aria-hidden="true"></i><span>Contact</span></button>
  </nav>
</div>

<!-- siteChrome.js renders Privacy & Legal here; its screen copies it -->
<div id="legal-card" hidden></div>

<script src="site-config.js"></script>
<script type="module" src="src/display/mobile.js?v=app4"></script>
</body>
</html>
