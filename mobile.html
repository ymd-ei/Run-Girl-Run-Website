<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Run Girl Run</title>
<meta name="description" content="3D character animation out of Toronto. Run Girl Run brings ideas to life through craft, curiosity, and a love for storytelling.">
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://rungirlrun.studio/">
<meta property="og:site_name" content="Run Girl Run">
<meta property="og:title" id="og-title" content="Run Girl Run Studio — Character Animation, Toronto">
<meta property="og:description" id="og-desc" content="3D character animation out of Toronto. Run Girl Run brings ideas to life through craft, curiosity, and a love for storytelling.">
<meta property="og:image" id="og-image" content="https://rungirlrun.studio/media/jammeratoast%20jammers.png">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="tw-title" content="Run Girl Run Studio — Character Animation, Toronto">
<meta name="twitter:description" id="tw-desc" content="3D character animation out of Toronto. Run Girl Run brings ideas to life through craft, curiosity, and a love for storytelling.">
<meta name="twitter:image" id="tw-image" content="https://rungirlrun.studio/media/jammeratoast%20jammers.png">
<link rel="icon" id="favicon" href="media/rgr_fav.png">
<link rel="apple-touch-icon" href="media/rgr_fav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<link rel="stylesheet" href="styles-content.css?v=5">
<link rel="stylesheet" href="styles-mobile.css?v=26">
</head>
<body>

<!-- Top bar: dog + availability, pinned while the page scrolls -->
<div class="m-bar" id="m-bar">
  <span class="m-logo" id="m-logo" hidden></span>
  <p class="hero-avail" id="hero-avail" style="display:none"><span class="avail-dot"></span><span id="avail-text"></span></p>
</div>

<!-- TOP: reel and hero share one background video (like Contact) -->
<div id="top">
<div id="hero-bg" class="hero-bg" aria-hidden="true"></div>
<div class="top-content">

<!-- REEL -->
<section id="reel-section">
  <div id="reel-embed"></div>
</section>

<header id="hero">
  <div class="hero-content">
    <div class="hero-id">
      <p class="hero-role" id="hero-role"></p>
      <h1 class="hero-name" id="hero-name"></h1>
    </div>
    <nav class="hero-nav" aria-label="Site">
      <button type="button" class="hero-nav-btn" data-open="work" aria-haspopup="dialog"><span data-site-text="navWork">Work</span> <i class="ph-fill ph-arrow-up" aria-hidden="true"></i></button>
      <button type="button" class="hero-nav-btn" data-open="about" aria-haspopup="dialog"><span data-site-text="navAbout">About</span> <i class="ph-fill ph-arrow-up" aria-hidden="true"></i></button>
    </nav>
  </div>
</header>

</div>
</div>

<!-- CONTACT -->
<section id="contact">
  <div id="ct-bg-video" class="ct-bg-video" aria-hidden="true"></div>
  <div class="ct-content">
    <h2 class="section-title contact-title" id="ct-title"></h2>
    <p class="contact-sub" id="ct-sub"></p>
    <div class="contact-email-block">
      <p class="contact-label" id="ct-email-label"></p>
      <a id="ct-email-link" href="#" class="contact-email"></a>
      <button type="button" class="ct-copy-email" id="ct-copy-email" hidden><i class="ph-fill ph-copy" aria-hidden="true"></i><span aria-live="polite">Copy email</span></button>
    </div>
    <div class="contact-social-block">
      <p class="contact-label" id="ct-social-label"></p>
      <div class="contact-icons" id="ct-icons"></div>
    </div>
    <div id="ct-resume-wrap" class="contact-resume-block" style="display:none">
      <p class="contact-label" id="ct-resume-label">Credentials</p>
      <a id="ct-resume-link" href="#" target="_blank" rel="noopener" class="contact-resume-link">
        <i class="ph-fill ph-file-pdf" aria-hidden="true"></i>
        <span data-site-text="resumeLink">View Resume</span>
        <i class="ph-fill ph-arrow-right" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</section>

<footer id="footer">
  <span data-site-text="footer">© Run Girl Run</span>
  <button type="button" class="lite-toggle" id="lite-toggle" aria-pressed="false"><span data-site-text="liteMode">Lite mode</span><span class="lite-switch" aria-hidden="true"></span></button>
  <button class="legal-trigger" onclick="openLegalModal()" data-site-text="legalLink">Privacy &amp; Legal</button>
</footer>

<!-- About / Work sheet: slides up, swipe down to close -->
<div id="sheet-bd" class="sheet-bd" aria-hidden="true"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
  <div class="sheet-handle" aria-hidden="true"><span></span></div>
  <div class="sheet-head">
    <button type="button" class="sheet-back" id="sheet-back" hidden><i class="ph-fill ph-arrow-left" aria-hidden="true"></i> <span data-site-text="back">Back</span></button>
    <h2 class="sheet-title" id="sheet-title"></h2>
    <button type="button" class="sheet-close" id="sheet-close" aria-label="Close">&#x2715;</button>
  </div>
  <div class="sheet-body ppbody" id="sheet-body"></div>
</div>

<!-- Legal Modal -->
<div id="legal-modal" role="dialog" aria-modal="true" aria-labelledby="legal-title" onclick="if(event.target===this)closeLegalModal()">
  <div id="legal-card"></div>
</div>

<script src="site-config.js"></script>
<script type="module" src="src/display/mobile.js"></script>
</body>
</html>
