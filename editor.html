<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Editor v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<link rel="stylesheet" href="styles-editor-v3.css">
</head>
<body>

<div id="v3-app">
  <!-- TOP BAR -->
  <header id="v3-topbar">
    <div class="v3-brand"><span>RGR Studio</span> Editor <b>v3</b></div>

    <div class="v3-history-group">
      <button id="v3-undo" class="v3-icon-btn" title="Undo (⌘Z)" disabled><i class="ph-fill ph-arrow-counter-clockwise"></i></button>
      <button id="v3-redo" class="v3-icon-btn" title="Redo (⇧⌘Z)" disabled><i class="ph-fill ph-arrow-clockwise"></i></button>
    </div>

    <div class="v3-topbar-spacer"></div>

    <span id="v3-deploy" class="v3-deploy"></span>
    <div id="v3-auth" class="v3-auth"></div>
    <a class="v3-link" href="index.html" target="_blank">View Live <i class="ph-fill ph-arrow-up-right"></i></a>
    <a class="v3-link v3-link-muted" href="editor-v1.html">Switch to v1 (legacy)</a>
    <button id="v3-save" class="v3-save" disabled><i class="ph-fill ph-cloud-arrow-up"></i> <span class="v3-save-label">Saved</span></button>
  </header>

  <!-- MAIN -->
  <div id="v3-main">
    <!-- LEFT RAIL -->
    <nav id="v3-rail">
      <div class="v3-rail-section">Sections</div>
      <div id="v3-rail-sections"></div>
      <div class="v3-rail-section">Projects</div>
      <div id="v3-rail-projects"></div>
    </nav>

    <!-- CANVAS (the real site) -->
    <div id="v3-canvas-wrap">
      <div id="v3-canvas-frame">
        <iframe id="v3-frame" title="Live editable site"></iframe>
      </div>
    </div>

    <!-- RIGHT INSPECTOR -->
    <aside id="v3-inspector">
      <div class="v3-insp-empty">
        <i class="ph-fill ph-cursor-click"></i>
        <p>Loading the live site…</p>
      </div>
    </aside>
  </div>
</div>

<div id="v3-toast"></div>

<script>
  // API config — same pattern as v1/v2. Capture session token from OAuth redirect.
  const params = new URLSearchParams(location.search);
  const apiParam = params.get('api');
  const tokenParam = params.get('session_token');
  if (tokenParam) {
    localStorage.setItem('editor_session_token', tokenParam);
    params.delete('session_token');
    const next = `${location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
    history.replaceState({}, '', next);
  }
  if (apiParam) localStorage.setItem('editor_api_base', apiParam);
  window.__V3_API_BASE = apiParam || localStorage.getItem('editor_api_base') || 'https://rgr-editor-backend.rungirlrun.workers.dev';
</script>

<script type="module" src="src/editor-v3/app.js"></script>
</body>
</html>
