<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Editor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────
   RESET & TOKENS
───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#181818;--surface2:#212121;--border:#2c2c2c;
  --text:#e8e5df;--muted:#666;--accent:#71904c;--green:#3a9e6e;
  --font:'DM Sans',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;font-weight:300;min-height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:200px 1fr 1fr;height:100vh;overflow:hidden}

/* ─────────────────────────────────────────
   SIDEBAR
───────────────────────────────────────── */
#sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sb-logo{padding:1.25rem 1rem;border-bottom:1px solid var(--border);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.sb-logo span{color:var(--accent);display:block;font-size:.95rem;letter-spacing:.04em;margin-bottom:.15rem;font-weight:400}
.sb-section{padding:.65rem 1rem .2rem;font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ni{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;color:var(--muted);font-size:.78rem;border:none;background:none;width:100%;text-align:left;transition:color .15s,background .15s;border-left:2px solid transparent}
.ni:hover{color:var(--text);background:var(--surface2)}
.ni.active{color:var(--text);background:var(--surface2);border-left-color:var(--accent)}
.ni .dot{width:5px;height:5px;border-radius:50%;background:var(--muted);flex-shrink:0}
.ni.active .dot{background:var(--accent)}
.ni .badge{margin-left:auto;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;padding:.12rem .35rem;border:1px solid var(--border);color:var(--muted)}
.add-proj{margin:.75rem 1rem;padding:.5rem;border:1px dashed var(--border);background:none;color:var(--muted);font-family:var(--font);font-size:.72rem;letter-spacing:.04em;width:calc(100% - 2rem);transition:color .15s,border-color .15s}
.add-proj:hover{color:var(--accent);border-color:var(--accent)}
.sb-footer{margin-top:auto;padding:.75rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem}
.preview-btn{padding:.55rem;background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--font);font-size:.7rem;letter-spacing:.04em;transition:all .15s}
.preview-btn:hover{border-color:var(--text);color:var(--text)}
.save-btn{padding:.55rem;background:var(--accent);border:none;color:#fff;font-family:var(--font);font-size:.7rem;letter-spacing:.04em;transition:opacity .15s}
.save-btn:hover{opacity:.85}
.save-btn:disabled{opacity:.35}

/* ─────────────────────────────────────────
   MAIN PANEL
───────────────────────────────────────── */
#main{padding:2rem;max-width:680px;height:100vh;overflow-y:auto}
.page-title{font-size:1.3rem;font-weight:500;margin-bottom:.25rem}
.page-sub{font-size:.78rem;color:var(--muted);margin-bottom:1.75rem}

/* ─────────────────────────────────────────
   PREVIEW PANE
───────────────────────────────────────── */
#preview-pane{border-left:1px solid var(--border);display:flex;flex-direction:column;height:100vh;background:#111}
#preview-bar{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
#preview-bar span{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#preview-bar .pb-actions{display:flex;gap:.5rem;align-items:center}
.pb-indicator{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .3s}
.pb-indicator.live{background:var(--green)}
#preview-refresh{padding:.3rem .7rem;background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--font);font-size:.65rem;letter-spacing:.06em;transition:all .15s}
#preview-refresh:hover{border-color:var(--text);color:var(--text)}
#preview-frame{flex:1;border:none;width:100%}

/* ─────────────────────────────────────────
   SECTION CARDS
───────────────────────────────────────── */
.section{background:var(--surface);border:1px solid var(--border);margin-bottom:1rem;overflow:hidden}
.sh{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.sh h3{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.sh .chev{font-size:.65rem;color:var(--muted);transition:transform .2s}
.sh.collapsed .chev{transform:rotate(-90deg)}
.sb{padding:1.1rem;display:flex;flex-direction:column;gap:.9rem}
.sb.hidden{display:none}

/* ─────────────────────────────────────────
   FIELDS
───────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:.85rem;font-weight:300;padding:.5rem .65rem;outline:none;width:100%;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.field textarea{resize:vertical;min-height:70px;line-height:1.6}
.hint{font-size:.65rem;color:var(--muted);margin-top:.1rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}

/* ─────────────────────────────────────────
   BLOCK EDITOR
───────────────────────────────────────── */
.block-list{display:flex;flex-direction:column;gap:.5rem}
.bk{background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.bk-head{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.bk-type{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);flex-shrink:0}
.bk-preview{font-size:.75rem;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bk-actions{display:flex;gap:.25rem;margin-left:auto;flex-shrink:0}
.bk-btn{background:none;border:none;color:var(--muted);font-size:.85rem;padding:.2rem .3rem;transition:color .15s;line-height:1}
.bk-btn:hover{color:var(--text)}
.bk-btn.del:hover{color:var(--accent)}
.bk-body{padding:.8rem;display:flex;flex-direction:column;gap:.65rem}
.bk-body.hidden{display:none}

/* ─────────────────────────────────────────
   ALIGN TOGGLE
───────────────────────────────────────── */
.align-row{display:flex;gap:.3rem}
.al-btn{padding:.3rem .65rem;border:1px solid var(--border);background:none;color:var(--muted);font-size:.7rem;font-family:var(--font);transition:all .15s}
.al-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ─────────────────────────────────────────
   SIZE TOGGLE
───────────────────────────────────────── */
.size-row{display:flex;gap:.3rem}
.sz-btn{padding:.3rem .65rem;border:1px solid var(--border);background:none;color:var(--muted);font-size:.7rem;font-family:var(--font);transition:all .15s}
.sz-btn.active{background:var(--surface);border-color:var(--text);color:var(--text)}

/* ─────────────────────────────────────────
   TWOCOL EDITOR
───────────────────────────────────────── */
.twocol-editor{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.col-editor{border:1px solid var(--border);padding:.65rem}
.col-label{font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}

/* ─────────────────────────────────────────
   ADD BLOCK MENU
───────────────────────────────────────── */
.add-block-btn{width:100%;padding:.55rem;border:1px dashed var(--border);background:none;color:var(--muted);font-family:var(--font);font-size:.72rem;letter-spacing:.04em;margin-top:.25rem;transition:all .15s}
.add-block-btn:hover{border-color:var(--accent);color:var(--accent)}
.block-menu{background:var(--surface);border:1px solid var(--border);padding:.4rem;display:grid;grid-template-columns:1fr 1fr;gap:.3rem;margin-top:.3rem}
.block-menu.hidden{display:none}
.bm-item{display:flex;align-items:center;gap:.5rem;padding:.45rem .6rem;border:1px solid var(--border);font-size:.72rem;color:var(--muted);background:none;font-family:var(--font);transition:all .15s;text-align:left}
.bm-item:hover{background:var(--surface2);color:var(--text)}
.bm-icon{width:20px;height:20px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.6rem;color:var(--muted)}

/* ─────────────────────────────────────────
   IMG FIELD
───────────────────────────────────────── */
.img-row{display:flex;gap:.4rem}
.img-path{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:.78rem;padding:.4rem .55rem;outline:none;transition:border-color .15s;width:100%}
.img-path:focus{border-color:var(--accent)}
.dropzone{border:1px dashed var(--border);padding:.75rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;cursor:pointer;transition:border-color .15s,background .15s;position:relative;text-align:center}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(113,144,76,0.05)}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dropzone .dz-label{font-size:.68rem;color:var(--muted);letter-spacing:.06em}
.dropzone .dz-sub{font-size:.6rem;color:var(--muted);opacity:.6}
.dropzone .dz-preview{width:100%;max-height:80px;object-fit:cover;display:block;margin-top:.3rem}
.dz-uploading{font-size:.68rem;color:var(--accent);letter-spacing:.06em;animation:pulse-o 1s infinite}
@keyframes pulse-o{0%,100%{opacity:1}50%{opacity:.4}}
.dz-path{font-size:.65rem;color:var(--muted);margin-top:.25rem;word-break:break-all}
.dz-local-note{font-size:.6rem;color:var(--accent);margin-top:.2rem;letter-spacing:.04em}

/* ─────────────────────────────────────────
   SKILLS
───────────────────────────────────────── */
.skill-item{display:grid;grid-template-columns:1fr 80px auto;gap:.5rem;align-items:center}
.skill-pct{font-size:.78rem;color:var(--accent);text-align:right;font-weight:500}
.del-btn{background:none;border:none;color:var(--muted);font-size:.9rem;padding:.2rem;transition:color .15s}
.del-btn:hover{color:var(--accent)}
.add-btn{background:none;border:1px dashed var(--border);color:var(--muted);font-family:var(--font);font-size:.7rem;padding:.45rem .8rem;transition:all .15s;align-self:flex-start}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ─────────────────────────────────────────
   STAT ITEMS
───────────────────────────────────────── */
.stat-item{display:grid;grid-template-columns:80px 1fr auto;gap:.5rem;align-items:center}

/* ─────────────────────────────────────────
   CONTACT
───────────────────────────────────────── */
.contact-fields{display:flex;flex-direction:column;gap:.65rem}

/* ─────────────────────────────────────────
   REEL
───────────────────────────────────────── */
.reel-row{display:grid;grid-template-columns:110px 1fr;gap:.75rem}

/* ─────────────────────────────────────────
   TOAST
───────────────────────────────────────── */
#toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--green);color:#fff;padding:.65rem 1.1rem;font-size:.78rem;letter-spacing:.04em;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:999}
#toast.show{opacity:1;transform:translateY(0)}
#toast.error{background:#8b2020}

/* ─────────────────────────────────────────
   DANGER
───────────────────────────────────────── */
.danger-zone{border-top:1px solid var(--border);padding:.9rem 1.1rem;margin-top:.25rem}
.danger-btn{background:none;border:1px solid #5a2020;color:#c06060;font-family:var(--font);font-size:.7rem;padding:.45rem .9rem;transition:all .15s}
.danger-btn:hover{background:#5a2020;color:var(--text)}

/* ─────────────────────────────────────────
   COLOR FIELD
───────────────────────────────────────── */
.color-field{display:flex;flex-direction:column;gap:.35rem}
.color-field label{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.color-row{display:flex;align-items:center;gap:.5rem}
.color-swatch{width:32px;height:32px;border:1px solid var(--border);border-radius:2px;padding:0;overflow:hidden;cursor:pointer;flex-shrink:0;position:relative}
.color-swatch input[type=color]{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);opacity:0;cursor:pointer;border:none;padding:0}
.color-swatch-fill{position:absolute;inset:0;pointer-events:none}
.color-hex{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:.8rem;font-weight:300;padding:.35rem .5rem;outline:none;width:100%;transition:border-color .15s}
.color-hex:focus{border-color:var(--accent)}
.md-import-btn{width:100%;padding:.55rem;border:1px dashed var(--border);background:none;color:var(--muted);font-family:var(--font);font-size:.72rem;letter-spacing:.04em;margin-top:.25rem;transition:all .15s;text-align:center}
.md-import-btn:hover{border-color:#6a8ad0;color:#6a8ad0}

/* ─────────────────────────────────────────
   DRAG INDICATOR
───────────────────────────────────────── */
.bk.drag-over-top{border-top:2px solid var(--accent)}
.bk.drag-over-bottom{border-bottom:2px solid var(--accent)}
.ni.proj-drag-over{border-left-color:var(--accent);background:var(--surface2)}
.ni[draggable=true]{cursor:grab}

/* ─────────────────────────────────────────
   UNDO BAR
───────────────────────────────────────── */
#undo-bar{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  display:flex;gap:.4rem;pointer-events:none;z-index:998;opacity:0;transition:opacity .2s}
#undo-bar.show{opacity:1;pointer-events:all}
.undo-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);
  font-family:var(--font);font-size:.65rem;letter-spacing:.08em;padding:.4rem .8rem;
  transition:all .15s}
.undo-btn:hover{border-color:var(--text);color:var(--text)}
.undo-btn:disabled{opacity:.25;pointer-events:none}

@media(max-width:900px){#app{grid-template-columns:200px 1fr}#preview-pane{display:none}}
@media(max-width:680px){#app{grid-template-columns:1fr}#sidebar{position:relative;height:auto}.row2,.row3,.twocol-editor{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sb-logo"><span id="sb-name">YOUR NAME</span>Portfolio Editor</div>
    <div class="sb-section">Global</div>
    <button class="ni active" onclick="showPage('global')" id="nav-global"><div class="dot"></div>Settings</button>
    <button class="ni" onclick="showPage('about')" id="nav-about"><div class="dot"></div>About</button>
    <button class="ni" onclick="showPage('contact')" id="nav-contact"><div class="dot"></div>Contact</button>
    <div class="sb-section">Projects</div>
    <div id="project-nav"></div>
    <button class="add-proj" onclick="addProject()">+ New Project</button>
    <div class="sb-footer">
      <button class="preview-btn" onclick="window.open('index.html','_blank')">Preview Site &#x2197;</button>
      <button class="preview-btn" onclick="clearToken()" id="token-btn">&#x1F511; Token: Not set</button>
      <button class="save-btn" id="save-btn" onclick="saveAll()">Save All Changes</button>
    </div>
  </div>
  <div id="main">
    <div id="page-global"></div>
    <div id="page-about" style="display:none"></div>
    <div id="page-contact" style="display:none"></div>
    <div id="page-project" style="display:none"></div>
  </div>
  <div id="preview-pane">
    <div id="preview-bar">
      <span>Live Preview</span>
      <div class="pb-actions">
        <div class="pb-indicator" id="pb-dot"></div>
        <button id="preview-refresh" onclick="refreshPreview()">Refresh</button>
      </div>
    </div>
    <iframe id="preview-frame" src="index.html?preview=1"></iframe>
  </div>
</div>
<div id="toast"></div>
<div id="undo-bar">
  <button class="undo-btn" id="undo-btn" onclick="undo()">&#x21B6; Undo <span id="undo-label"></span></button>
  <button class="undo-btn" id="redo-btn" onclick="redo()">Redo &#x21B7;</button>
</div>

<script>
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let C={}, projects=[], currentPage='global', currentProjectId=null, dirty=false;
let openBlocks = new Set(); // tracks which block bodies are expanded

// Undo/redo history
let history=[], historyIdx=-1;
const MAX_HISTORY=50;

function snapshot(label){
  // Trim any future states if we branched
  history=history.slice(0,historyIdx+1);
  history.push({label, C:JSON.parse(JSON.stringify(C)), projects:JSON.parse(JSON.stringify(projects))});
  if(history.length>MAX_HISTORY) history.shift();
  historyIdx=history.length-1;
  updateUndoBar();
}

function undo(){
  if(historyIdx<=0) return;
  historyIdx--;
  const s=history[historyIdx];
  C=JSON.parse(JSON.stringify(s.C));
  projects=JSON.parse(JSON.stringify(s.projects));
  rebuildAfterHistoryChange();
}

function redo(){
  if(historyIdx>=history.length-1) return;
  historyIdx++;
  const s=history[historyIdx];
  C=JSON.parse(JSON.stringify(s.C));
  projects=JSON.parse(JSON.stringify(s.projects));
  rebuildAfterHistoryChange();
}

function rebuildAfterHistoryChange(){
  rendered.clear(); // all pages need re-render after undo/redo
  buildNav();
  // Re-render currently visible page immediately
  if(currentPage==='global') renderGlobal();
  else if(currentPage==='about') renderAbout();
  else if(currentPage==='contact') renderContact();
  else if(currentPage==='project'&&currentProjectId){
    const p=projects.find(x=>x.id===currentProjectId);
    if(p) renderProject(currentProjectId);
    else { currentProjectId=null; showPage('global'); }
  }
  rendered.add(currentPage);
  markDirty();
  updateUndoBar();
}

function updateUndoBar(){
  const bar=document.getElementById('undo-bar');
  const undoBtn=document.getElementById('undo-btn');
  const redoBtn=document.getElementById('redo-btn');
  const label=document.getElementById('undo-label');
  const canUndo=historyIdx>0;
  const canRedo=historyIdx<history.length-1;
  undoBtn.disabled=!canUndo;
  redoBtn.disabled=!canRedo;
  label.textContent=canUndo ? '('+history[historyIdx].label+')' : '';
  bar.classList.toggle('show', canUndo||canRedo);
}

// ─────────────────────────────────────────
// DATA LOADING & NAV
// ─────────────────────────────────────────
const rendered = new Set(); // tracks which pages have been rendered at least once

function markPageStale(name){ rendered.delete(name); }

function showPage(name){
  ['global','about','contact','project'].forEach(n=>{
    document.getElementById('page-'+n).style.display='none';
    const el=document.getElementById('nav-'+n); if(el)el.classList.remove('active');
  });
  projects.forEach(p=>{ const el=document.getElementById('nav-proj-'+p.id); if(el)el.classList.remove('active'); });
  document.getElementById('page-'+name).style.display='';
  const navEl=document.getElementById('nav-'+name); if(navEl)navEl.classList.add('active');
  currentPage=name;
  if(name!=='project') currentProjectId=null;
  // Only re-render if stale
  if(!rendered.has(name)){
    if(name==='global') renderGlobal();
    else if(name==='about') renderAbout();
    else if(name==='contact') renderContact();
    rendered.add(name);
  }
  sendPreviewNav();
}

function showProject(id){
  showPage('project');
  currentProjectId=id;
  const el=document.getElementById('nav-proj-'+id); if(el)el.classList.add('active');
  renderProject(id);
  sendPreviewNav();
}

async function loadAll(){
  try{
    C=await fetch('content.json?v='+Date.now()).then(r=>r.json());
    projects=await Promise.all(C.projects.map(id=>fetch('projects/'+id+'.json?v='+Date.now()).then(r=>r.json())));
    buildNav();
    renderGlobal(); renderAbout(); renderContact();
    rendered.add('global'); rendered.add('about'); rendered.add('contact');
    initPreview();
    snapshot('initial');
  }catch(e){ toast('Error loading files: '+e.message,true); }
  updateTokenBtn();
}

// Keyboard shortcuts
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  if((e.metaKey||e.ctrlKey) && (e.key==='y' || (e.key==='z' && e.shiftKey))){ e.preventDefault(); redo(); }
});

function showProject(id){
  showPage('project');
  currentProjectId=id;
  const el=document.getElementById('nav-proj-'+id); if(el)el.classList.add('active');
  renderProject(id);
  sendPreviewNav();
}

// ─────────────────────────────────────────
// PAGE RENDERERS — GLOBAL
// ─────────────────────────────────────────
function renderGlobal(){
  document.getElementById('page-global').innerHTML=`
    <div class="page-title">Site Settings</div>
    <div class="page-sub">Name, role, and demo reel.</div>
    <div class="section">
      <div class="sh" onclick="toggleSection(this)"><h3>Identity</h3><span class="chev">&#x25BE;</span></div>
      <div class="sb">
        <div class="row2">
          <div class="field"><label>Name</label><input value="${C.name}" oninput="C.name=this.value;document.getElementById('sb-name').textContent=this.value;markDirty()"></div>
          <div class="field"><label>Role</label><input value="${C.role}" oninput="C.role=this.value;markDirty()"></div>
        </div>
        <div class="field"><label>Site Title</label><input value="${C.siteTitle||''}" placeholder="${C.name} — Portfolio" oninput="C.siteTitle=this.value;markDirty()"><p class="hint">Browser tab title. Defaults to your name if left empty.</p></div>
        <div class="field"><label>Favicon</label>
          ${makeDropzone(C.favicon||'', v=>{ C.favicon=v; markDirty(); }, 'media', 'favicon.png')}
          <p class="hint">Recommended: square PNG or ICO, at least 32×32px</p>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="sh" onclick="toggleSection(this)"><h3>Demo Reel</h3><span class="chev">&#x25BE;</span></div>
      <div class="sb">
        <div class="field">
          <label>Paste YouTube / Vimeo embed code or URL</label>
          <textarea placeholder="Paste anything — full iframe code, share URL, or embed URL" oninput="parseReelInput(this.value)" style="min-height:60px">${C.reel.url||''}</textarea>

function getCP(){ return C.contactPanel||(C.contactPanel={}); }
function cpSet(key,val){ getCP()[key]=val; markDirty(); }

function parseContactVideo(raw){
  const val=raw.trim();
  if(!val){ getCP().video={type:'placeholder',url:''}; markDirty(); updateContactVideoHint('No video set'); return; }
  const srcMatch=val.match(/src=["']([^"']+)["']/);
  const url=srcMatch?srcMatch[1]:val;
  const ytEmbed=url.match(/youtube\.com\/embed\/([\w-]+)/);
  const ytShort=url.match(/youtu\.be\/([\w-]+)/);
  const ytWatch=url.match(/youtube\.com\/watch\?v=([\w-]+)/);
  const ytId=(ytEmbed&&ytEmbed[1])||(ytShort&&ytShort[1])||(ytWatch&&ytWatch[1]);
  if(ytId){ getCP().video={type:'youtube',url:`https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&loop=1&playlist=${ytId}&controls=0&rel=0`}; markDirty(); updateContactVideoHint('&#x2713; YouTube detected'); return; }
  const vimeoEmbed=url.match(/player\.vimeo\.com\/video\/([\d]+)/);
  const vimeoWatch=url.match(/vimeo\.com\/([\d]+)/);
  const vimeoId=(vimeoEmbed&&vimeoEmbed[1])||(vimeoWatch&&vimeoWatch[1]);
  if(vimeoId){ getCP().video={type:'vimeo',url:`https://player.vimeo.com/video/${vimeoId}?autoplay=1&loop=1&background=1&muted=1`}; markDirty(); updateContactVideoHint('&#x2713; Vimeo detected'); return; }
  if(url.match(/\.(mp4|webm|ogg)$/i)){ getCP().video={type:'video',url}; markDirty(); updateContactVideoHint('&#x2713; Local video'); return; }
  updateContactVideoHint('Could not detect — paste a Vimeo or YouTube URL');
}

function renderBlockList(scope, blocks){
  const listId = scope==='about' ? 'about-blocks' : 'proj-blocks-'+scope.replace('proj-','');
  const el=document.getElementById(listId); if(!el)return;
  if(!blocks||!blocks.length){el.innerHTML='<p style="font-size:.75rem;color:var(--muted);padding:.5rem 0">No blocks yet — add one below.</p>';return;}
  el.innerHTML=blocks.map((b,i)=>blockEditorHTML(scope,b,i,blocks.length)).join('');
}

function blockEditorHTML(scope, b, i, total){
  const preview = blockPreview(b);
  const canUp = i>0, canDown = i<total-1;
  let body='';

  if(b.type==='text-sm'||b.type==='text-md'||b.type==='text-lg'){
    const sizes=[['text-sm','Small'],['text-md','Medium'],['text-lg','Large']];
    body=`
      <div class="size-row">${sizes.map(([v,l])=>`<button class="sz-btn ${b.type===v?'active':''}" onclick="changeBlockType('${scope}','${b.id}','${v}')">${l}</button>`).join('')}</div>
      <div class="field"><textarea oninput="updateBlock('${scope}','${b.id}','content',this.value)">${b.content||''}</textarea></div>
      <p class="hint">Wrap text in &lt;b&gt;&lt;/b&gt; for accent bold &nbsp;·&nbsp; &lt;rgr&gt;&lt;/rgr&gt; for a badge</p>
      <div class="field"><label>Alignment</label><div class="align-row">
        ${['left','center','right'].map(a=>`<button class="al-btn ${(b.align||'left')===a?'active':''}" onclick="updateBlock('${scope}','${b.id}','align','${a}');rerenderBlocks('${scope}')">${a[0].toUpperCase()+a.slice(1)}</button>`).join('')}
      </div></div>`;
  } else if(b.type==='image'){
    body=`
      <div class="field"><label>Image</label>
        ${makeDropzone(b.src||'', v=>{ updateBlock(scope,b.id,'src',v); }, 'media', 'image.jpg')}
      </div>
      <div class="field"><label>Alt Text</label><input value="${b.alt||''}" oninput="updateBlock('${scope}','${b.id}','alt',this.value)"></div>`;
  } else if(b.type==='twocol'){
    body=`<div class="twocol-editor">
      <div><div class="col-label">Left Column</div>${colBlockEditor(scope,b,'left')}</div>
      <div><div class="col-label">Right Column</div>${colBlockEditor(scope,b,'right')}</div>
    </div>`;
  } else if(b.type==='quote'){
    body=`
      <div class="field"><textarea oninput="updateBlock('${scope}','${b.id}','content',this.value)">${b.content||''}</textarea></div>
      <div class="field"><label>Alignment</label><div class="align-row">
        ${['left','center','right'].map(a=>`<button class="al-btn ${(b.align||'left')===a?'active':''}" onclick="updateBlock('${scope}','${b.id}','align','${a}');rerenderBlocks('${scope}')">${a[0].toUpperCase()+a.slice(1)}</button>`).join('')}
      </div></div>`;
  } else if(b.type==='video'){
    body=`<div class="field"><label>Embed URL</label><input value="${b.src||''}" placeholder="Vimeo or YouTube embed URL" oninput="updateBlock('${scope}','${b.id}','src',this.value)"></div>`;
  } else if(b.type==='stats'){
    body=`<div style="display:flex;flex-direction:column;gap:.5rem" id="stats-${b.id}">
      ${(b.items||[]).map((s,si)=>`<div class="stat-item">
        <input value="${s.num}" placeholder="40+" oninput="updateStatItem('${scope}','${b.id}',${si},'num',this.value)">
        <input value="${s.label}" placeholder="Projects" oninput="updateStatItem('${scope}','${b.id}',${si},'label',this.value)">
        <button class="del-btn" onclick="removeStatItem('${scope}','${b.id}',${si})">&#x2715;</button>
      </div>`).join('')}
    </div>
    <button class="add-btn" onclick="addStatItem('${scope}','${b.id}')">+ Add Stat</button>`;
  } else if(b.type==='skills'){
    body=`<div style="display:flex;flex-direction:column;gap:.5rem" id="skills-${b.id}">
      ${(b.items||[]).map((s,si)=>`<div class="skill-item">
        <input value="${s.name}" placeholder="After Effects" oninput="updateSkillItem('${scope}','${b.id}',${si},'name',this.value)">
        <input type="range" min="0" max="100" value="${s.pct}" step="1" oninput="updateSkillItem('${scope}','${b.id}',${si},'pct',+this.value);this.nextElementSibling.textContent=this.value+'%'">
        <span class="skill-pct">${s.pct}%</span>
        <button class="del-btn" onclick="removeSkillItem('${scope}','${b.id}',${si})">&#x2715;</button>
      </div>`).join('')}
    </div>
    <button class="add-btn" onclick="addSkillItem('${scope}','${b.id}')">+ Add Skill</button>`;
  } else if(b.type==='divider'){
    body=`<p style="font-size:.72rem;color:var(--muted)">Horizontal rule divider.</p>`;
  }

  return`<div class="bk" id="bk-${b.id}" draggable="true" data-scope="${scope}" data-bid="${b.id}"
    ondragstart="blockDragStart(event)"
    ondragover="blockDragOver(event)"
    ondrop="blockDrop(event)"
    ondragend="blockDragEnd(event)">
    <div class="bk-head" onclick="toggleBk('${b.id}')">
      <span style="color:var(--muted);font-size:.8rem;cursor:grab;padding-right:.3rem" onmousedown="event.stopPropagation()" title="Drag to reorder">&#9776;</span>
      <span class="bk-type">${b.type}</span>
      <span class="bk-preview">${preview}</span>
      <div class="bk-actions">
        <button class="bk-btn del" onclick="event.stopPropagation();removeBlock('${scope}','${b.id}')" title="Delete">&#x2715;</button>
      </div>

let dragId=null;
let blockDragBid=null, blockDragScope=null;

// ── Block drag with insert line indicator
function blockDragStart(e){
  blockDragBid=e.currentTarget.dataset.bid;
  blockDragScope=e.currentTarget.dataset.scope;
  e.currentTarget.style.opacity='.4';
  e.dataTransfer.effectAllowed='move';
}
function blockDragEnd(e){
  e.currentTarget.style.opacity='1';
  blockDragBid=null; blockDragScope=null;
  // Clear all indicators
  document.querySelectorAll('.bk').forEach(b=>{
    b.classList.remove('drag-over-top','drag-over-bottom');
  });
}
function blockDragOver(e){
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  const bk=e.currentTarget;
  if(!blockDragBid||bk.dataset.bid===blockDragBid) return;
  // Clear others
  document.querySelectorAll('.bk').forEach(b=>b.classList.remove('drag-over-top','drag-over-bottom'));
  // Show indicator above or below based on mouse position
  const rect=bk.getBoundingClientRect();
  const mid=rect.top+rect.height/2;
  if(e.clientY<mid) bk.classList.add('drag-over-top');
  else bk.classList.add('drag-over-bottom');
}
function blockDrop(e){
  e.preventDefault();
  document.querySelectorAll('.bk').forEach(b=>b.classList.remove('drag-over-top','drag-over-bottom'));
  const targetBk=e.currentTarget;
  const targetBid=targetBk.dataset.bid;
  const targetScope=targetBk.dataset.scope;
  if(!blockDragBid||blockDragBid===targetBid||blockDragScope!==targetScope) return;
  const blocks=getBlocks(blockDragScope);
  const from=blocks.findIndex(b=>b.id===blockDragBid);
  let to=blocks.findIndex(b=>b.id===targetBid);
  if(from<0||to<0) return;
  // Insert above or below based on indicator
  const rect=targetBk.getBoundingClientRect();
  const insertAfter=e.clientY>rect.top+rect.height/2;
  if(insertAfter && to>=from) to++;
  else if(!insertAfter && to<=from) to--;
  const [moved]=blocks.splice(from,1);
  const finalTo=Math.max(0,Math.min(to,blocks.length));
  blocks.splice(finalTo,0,moved);
  setBlocks(blockDragScope,blocks);
  markDirty('reorder block'); rerenderBlocks(blockDragScope);
}

async function uploadMedia(file, folder){
  const tk = getToken();
  if(!tk) throw new Error('No GitHub token set');
  const path = folder + '/' + file.name;
  const existing = await ghGetSha(tk, path);
  if(existing){
    if(!confirm(file.name + ' already exists. Overwrite?')) return null;
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async e => {
      try{
        const b64 = e.target.result.split(',')[1];
        const body = {
          message: 'Editor: upload ' + path,
          content: b64,
          branch: BRANCH
        };
        if(existing) body.sha = existing;
        const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
          method: 'PUT',
          headers: {Authorization:'token '+tk, Accept:'application/vnd.github.v3+json', 'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        if(!r.ok){ const e=await r.json(); throw new Error(e.message||r.status); }
        resolve(path);
      } catch(err){ reject(err); }
    };
    reader.readAsDataURL(file);
  });
}

// ─────────────────────────────────────────
// DROPZONE (path input + local preview fallback)
// ─────────────────────────────────────────
function makeDropzone(currentVal, onUpload, folder, placeholder){
  const uid = 'dz' + Math.random().toString(36).slice(2,9);
  const pathId = uid + '_p';
  const dzId = uid + '_z';

  setTimeout(()=>{
    const dzEl = document.getElementById(dzId);
    const pathInput = document.getElementById(pathId);
    if(!dzEl || !pathInput) return;

    const input = dzEl.querySelector('input[type=file]');
    const label = dzEl.querySelector('.dz-label');
    const sub   = dzEl.querySelector('.dz-sub');

    // Typing the path directly always wins
    pathInput.addEventListener('input', e=>{
      onUpload(e.target.value);
      markDirty();
      // show as preview if it looks like an image path
      if(/\.(jpe?g|png|gif|webp|bmp|svg)$/i.test(e.target.value)){
        showPreview(dzEl, e.target.value);
      }
    });

    async function handleFile(file){
      if(!file) return;

      // 1. Immediate local preview regardless of upload outcome
      const objUrl = URL.createObjectURL(file);
      showPreview(dzEl, objUrl);
      const suggested = folder + '/' + file.name;

      const token = getToken();
      if(!token){
        // No token — show local preview, pre-fill path, prompt user
        label.textContent = file.name;
        sub.textContent = 'No GitHub token — set one to upload, or edit path manually';
        sub.style.opacity = '1';
        pathInput.value = suggested;
        // Don't call onUpload here; the user should confirm/edit the path first
        toast('Set a GitHub token to upload files, or type the path manually', true);
        return;
      }

      // 2. Try GitHub upload
      label.innerHTML = '<span class="dz-uploading">Uploading ' + file.name + '…</span>';
      sub.style.display = 'none';
      try{
        const path = await uploadMedia(file, folder);
        if(path){
          label.textContent = file.name;
          sub.textContent = '✓ Uploaded to ' + folder + '/';
          sub.style.display = '';
          sub.style.opacity = '1';
          pathInput.value = path;
          onUpload(path);
          markDirty();
          toast('Uploaded: ' + path);
        } else {
          // User cancelled overwrite — restore
          label.textContent = currentVal ? currentVal.split('/').pop() : 'Drop image or click to browse';
          sub.style.display = '';
        }
      } catch(err){
        // Upload failed — fall back to object URL for editor preview, flag to user
        label.textContent = file.name + ' (local preview only)';
        sub.textContent = 'Upload failed — enter the correct path manually below';
        sub.style.display = '';
        sub.style.opacity = '1';
        pathInput.value = suggested;
        toast('Upload error: ' + err.message, true);
        // Use object URL so the block editor shows the image now
        // but don't call onUpload — wait for user to type/confirm the real path
      }
    }

    function showPreview(container, src){
      let prev = container.querySelector('.dz-preview');
      if(!prev){
        prev = document.createElement('img');
        prev.className = 'dz-preview';
        container.appendChild(prev);
      }
      prev.src = src;
    }

    input.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
    dzEl.addEventListener('dragover', e=>{ e.preventDefault(); dzEl.classList.add('drag'); });
    dzEl.addEventListener('dragleave', ()=> dzEl.classList.remove('drag'));
    dzEl.addEventListener('drop', e=>{
      e.preventDefault(); dzEl.classList.remove('drag');
      if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    // Show existing image preview on load
    if(currentVal && /\.(jpe?g|png|gif|webp|bmp|svg)$/i.test(currentVal)){
      showPreview(dzEl, currentVal);
    }
  }, 50);

  const name = currentVal ? currentVal.split('/').pop() : null;
  return `<div style="display:flex;flex-direction:column;gap:.35rem">
    <input type="text" id="${pathId}" class="img-path" value="${currentVal||''}" placeholder="${folder}/filename.jpg" title="Type a path or drop a file below">
    <div class="dropzone" id="${dzId}">
      <input type="file" accept="image/*,video/*">
      <span class="dz-label">${name || 'Drop file or click to browse'}</span>
      <span class="dz-sub">Requires GitHub token to upload</span>
    </div>
  </div>`;
}

// ─────────────────────────────────────────
// GITHUB API — SAVE
// ─────────────────────────────────────────
const REPO='ymd-ei/Run-Girl-Run-Website';
const BRANCH='main';

function getToken(){ return localStorage.getItem('gh_token')||''; }
function setToken(t){ localStorage.setItem('gh_token',t); }

async function ghGetSha(token, path){
  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`,{
    headers:{Authorization:'token '+token, Accept:'application/vnd.github.v3+json'}
  });
  if(r.status===404) return null;
  const d=await r.json();
  return d.sha||null;
}

async function ghPutFile(token, path, content, sha, message){
  const body={message, content:btoa(unescape(encodeURIComponent(content))), branch:BRANCH};
  if(sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{
    method:'PUT',
    headers:{Authorization:'token '+token, Accept:'application/vnd.github.v3+json', 'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){ const e=await r.json(); throw new Error(e.message||r.status); }
  return r.json();
}

async function saveAll(){
  let token=getToken();
  if(!token){
    token=prompt('Enter your GitHub personal access token (stored locally in browser only):');
    if(!token) return;
    setToken(token);
  }
  const btn=document.getElementById('save-btn');
  btn.disabled=true; btn.textContent='Saving…';
  try{
    const files=[
      {path:'content.json', data:JSON.stringify(C,null,2)},
      ...projects.map(p=>({path:`projects/${p.id}.json`, data:JSON.stringify(p,null,2)}))
    ];
    for(const f of files){
      const sha=await ghGetSha(token, f.path);
      await ghPutFile(token, f.path, f.data, sha, `Editor: update ${f.path}`);
    }
    dirty=false; btn.disabled=false; btn.textContent='Save All Changes';
    toast('Saved to GitHub ✓');
  }catch(e){
    btn.disabled=false; btn.textContent='Save All Changes *';
    if(e.message.includes('Bad credentials')||e.message.includes('401')){
      localStorage.removeItem('gh_token'); updateTokenBtn();
      if(confirm('GitHub token is invalid or expired.\n\nClick OK to open GitHub and generate a new one.')){
        window.open('https://github.com/settings/personal-access-tokens/new','_blank');
      }
      toast('Token cleared — generate a new one',true);
    } else {
      toast('Error: '+e.message,true);
    }
  }
}

function clearToken(){
  if(getToken()){
    if(confirm('Clear saved GitHub token?')){ localStorage.removeItem('gh_token'); updateTokenBtn(); toast('Token cleared'); }
  } else {
    const t=prompt('Enter GitHub personal access token:');
    if(t){ setToken(t); updateTokenBtn(); toast('Token saved'); }
  }
}
function updateTokenBtn(){
  const btn=document.getElementById('token-btn');
  if(!btn) return;
  btn.textContent=getToken()?'\u{1F511} Token: Set':'\u{1F511} Token: Not set';
}

function toast(msg,isError){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.toggle('error',!!isError);
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3500);
}

// ─────────────────────────────────────────
// REEL URL PARSER
// ─────────────────────────────────────────
function reelHint(){
  if(!C.reel||!C.reel.url) return 'Supports YouTube iframes, youtu.be links, Vimeo iframes, and vimeo.com links.';
  if(C.reel.type==='youtube') return '&#x2713; YouTube detected';
  if(C.reel.type==='vimeo') return '&#x2713; Vimeo detected';
  if(C.reel.type==='video') return '&#x2713; Local video';
  return '';
}

function parseReelInput(raw){
  const val=raw.trim();
  if(!val){ C.reel={type:'placeholder',url:''};markDirty();updateReelHint('No reel set');return; }

  const srcMatch=val.match(/src=["']([^"']+)["']/);
  const url=srcMatch?srcMatch[1]:val;

  const ytEmbed=url.match(/youtube\.com\/embed\/([\w-]+)/);
  const ytShort=url.match(/youtu\.be\/([\w-]+)/);
  const ytWatch=url.match(/youtube\.com\/watch\?v=([\w-]+)/);
  const ytId=(ytEmbed&&ytEmbed[1])||(ytShort&&ytShort[1])||(ytWatch&&ytWatch[1]);
  if(ytId){
    C.reel={type:'youtube',url:`https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&loop=1&playlist=${ytId}&controls=0&rel=0`};
    markDirty();updateReelHint('&#x2713; YouTube detected — parameters added automatically');return;
  }

  const vimeoEmbed=url.match(/player\.vimeo\.com\/video\/([\d]+)/);
  const vimeoWatch=url.match(/vimeo\.com\/([\d]+)/);
  const vimeoId=(vimeoEmbed&&vimeoEmbed[1])||(vimeoWatch&&vimeoWatch[1]);
  if(vimeoId){
    C.reel={type:'vimeo',url:`https://player.vimeo.com/video/${vimeoId}?autoplay=1&loop=1&background=1&muted=1`};
    markDirty();updateReelHint('&#x2713; Vimeo detected — parameters added automatically');return;
  }

  if(url.match(/\.(mp4|webm|ogg)$/i)){
    C.reel={type:'video',url};
    markDirty();updateReelHint('&#x2713; Local video file');return;
  }

  updateReelHint('Could not detect type — paste a YouTube or Vimeo iframe or URL');
}

function updateReelHint(msg){
  const el=document.getElementById('reel-hint');
  if(el) el.innerHTML=msg;
}

// ─────────────────────────────────────────
// MARKDOWN IMPORT
// ─────────────────────────────────────────
function importMarkdown(scope){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.md,.txt,.markdown';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const md = ev.target.result;
      const parsed = parseMarkdownToBlocks(md);
      const existing = getBlocks(scope)||[];
      if(existing.length > 0){
        const mode = confirm(
          `Found ${parsed.length} blocks in "${file.name}".\n\n` +
          'OK = Replace all existing blocks\n' +
          'Cancel = Append to the end'
        );
        if(mode){
          setBlocks(scope, parsed);
        } else {
          setBlocks(scope, [...existing, ...parsed]);
        }
      } else {
        setBlocks(scope, parsed);
      }
      markDirty();
      rerenderBlocks(scope);
      toast(`Imported ${parsed.length} blocks from ${file.name}`);
    };
    reader.readAsText(file);
  };
  input.click();
}

function uid(){ return 'b'+Date.now()+Math.random().toString(36).slice(2,6); }

function parseMarkdownToBlocks(md){
  const lines = md.split('\n');
  const blocks = [];
  let i = 0;

  function inlineFormat(text){
    // Convert **bold** → <b>, *italic* → <i>, `code` → <b>
    return text
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\*([^*]+)\*/g, '<i>$1</i>')
      .replace(/`([^`]+)`/g, '<b>$1</b>');
  }

  while(i < lines.length){
    const raw = lines[i];
    const line = raw.trimEnd();

    // Skip blank lines
    if(!line.trim()){ i++; continue; }

    // H1 → text-lg (accent large heading)
    if(/^# /.test(line)){
      blocks.push({id:uid(), type:'text-lg', content:inlineFormat(line.slice(2).trim()), align:'left'});
      i++; continue;
    }

    // H2 → text-md bold
    if(/^## /.test(line)){
      blocks.push({id:uid(), type:'text-md', content:'<b>'+inlineFormat(line.slice(3).trim())+'</b>', align:'left'});
      i++; continue;
    }

    // H3+ → text-sm uppercase label
    if(/^#{3,} /.test(line)){
      blocks.push({id:uid(), type:'text-sm', content:inlineFormat(line.replace(/^#+\s/,'')).toUpperCase(), align:'left'});
      i++; continue;
    }

    // Blockquote — collect consecutive lines
    if(/^> /.test(line)){
      const quoteLines = [];
      while(i < lines.length && /^> /.test(lines[i])){
        quoteLines.push(lines[i].slice(2).trim());
        i++;
      }
      blocks.push({id:uid(), type:'quote', content:inlineFormat(quoteLines.join(' ')), align:'left'});
      continue;
    }

    // Divider
    if(/^---+$/.test(line.trim()) || /^\*\*\*+$/.test(line.trim())){
      blocks.push({id:uid(), type:'divider'});
      i++; continue;
    }

    // Image: ![alt](src)
    const imgMatch = line.match(/^!\[([^\]]*)\]\(([^)]+)\)/);
    if(imgMatch){
      blocks.push({id:uid(), type:'image', src:imgMatch[2], alt:imgMatch[1]});
      i++; continue;
    }

    // Stats shorthand: lines like "148,000 | Combined Views"
    const statMatch = line.match(/^([\d,]+\+?)\s*\|\s*(.+)$/);
    if(statMatch){
      // Collect consecutive stat lines into one stats block
      const items = [];
      while(i < lines.length){
        const sm = lines[i].match(/^([\d,]+[^|]*?)\s*\|\s*(.+)$/);
        if(!sm) break;
        items.push({num: sm[1].trim(), label: sm[2].trim()});
        i++;
      }
      blocks.push({id:uid(), type:'stats', items});
      continue;
    }

    // Regular paragraph — collect until blank line or block-level marker
    const paraLines = [];
    while(i < lines.length){
      const l = lines[i];
      if(!l.trim()) break; // blank line ends paragraph
      if(/^[#>!]/.test(l)) break; // block marker
      if(/^---+$/.test(l.trim()) || /^\*\*\*+$/.test(l.trim())) break;
      paraLines.push(l.trim());
      i++;
    }
    if(paraLines.length){
      const content = inlineFormat(paraLines.join(' '));
      blocks.push({id:uid(), type:'text-md', content, align:'left'});
    }
  }

  return blocks;
}

// ─────────────────────────────────────────
// THEME
// ─────────────────────────────────────────
const THEME_DEFAULTS = {
  ink:'#1a1714', paper:'#f2ede4', accent:'#71904c', panelBg:'#f7f3ec',
  ctAccent:'#ff7828', ctBg:'#080808', ctHi:'#ffffff', sensitiveColor:'#e03030'
};

function getTheme(){ return C.theme||(C.theme={}); }

function colorField(label, key, defaultVal){
  const current = getTheme()[key] || defaultVal;
  const uid = 'cf_'+key;
  return `<div class="color-field">
    <label>${label}</label>
    <div class="color-row">
      <div class="color-swatch" style="background:${current}">
        <div class="color-swatch-fill" style="background:${current}" id="${uid}_fill"></div>
        <input type="color" value="${current}" oninput="setThemeColor('${key}',this.value,'${uid}')">
      </div>
      <input class="color-hex" id="${uid}_hex" value="${current}" maxlength="7"
        oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value))setThemeColor('${key}',this.value,'${uid}')">
    </div>
  </div>`;
}

function setThemeColor(key, val, uid){
  getTheme()[key] = val;
  markDirty();
  const fill = document.getElementById(uid+'_fill');
  const hex  = document.getElementById(uid+'_hex');
  if(fill){ fill.style.background = val; fill.parentElement.style.background = val; }
  if(hex && document.activeElement !== hex) hex.value = val;
}

function resetTheme(){
  if(!confirm('Reset all colours to defaults?')) return;
  C.theme = {...THEME_DEFAULTS};
  markDirty();
  renderGlobal();
  showPage('global');
}

loadAll();
