<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texture Compare</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../media/rgr_fav.png">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
  /* same look as Render Grid (/grid): ink, paper and accent come from Site settings → Theme when the page loads */
  :root { --ink:#1a1714; --ink-rgb:26,23,20; --paper:#f2ede4; --paper-rgb:242,237,228; --accent:#669c35; --on-accent:#fff;
          --panel:color-mix(in srgb, var(--ink) 95%, var(--paper)); --field:color-mix(in srgb, var(--ink) 89%, var(--paper));
          --line:rgba(var(--paper-rgb),.12); --dim:rgba(var(--paper-rgb),.58); --faint:rgba(var(--paper-rgb),.34);
          --accent-hi:color-mix(in srgb, var(--accent) 82%, white);
          --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
          --sans:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
          --edge:max(20px, calc((100vw - 1760px) / 2)); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:grid; grid-template-rows:auto minmax(0, 1fr); background:var(--ink); color:var(--paper);
         font:14px/1.35 var(--sans); -webkit-font-smoothing:antialiased; }

  #bar { background:var(--panel); border-bottom:1px solid var(--line); padding:10px var(--edge);
         display:flex; flex-wrap:wrap; gap:9px 34px; align-items:center; }
  .group { display:flex; flex-wrap:wrap; gap:9px 12px; align-items:center; }
  .row { display:flex; gap:7px; align-items:center; color:var(--dim); white-space:nowrap; }
  input[type=range] { width:112px; height:24px; margin:0; accent-color:var(--accent-hi); cursor:grab; }
  input, select, button { min-width:0; font:inherit; color:var(--paper); }
  select { height:32px; max-width:260px; padding:0 9px; background:var(--field); border:1px solid var(--line); border-radius:7px; }
  select:disabled { opacity:1; }
  button { height:32px; padding:0 12px; background:transparent; border:1px solid var(--line); border-radius:7px; cursor:pointer; }
  button:hover { border-color:var(--faint); }
  .group button.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .icon { width:32px; padding:0; color:var(--dim); }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:1px; }
  #gainWrap[hidden] { display:none; }
  #info { margin:0 0 0 auto; font-size:13px; color:var(--dim); text-align:right; }

  main { position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #drop { position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:24px var(--edge); }
  #drop[hidden] { display:none; }
  .half { display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center; height:100%; padding:24px; text-align:center;
          background:color-mix(in srgb, var(--ink) 80%, transparent); border:1.5px dashed var(--line); border-radius:14px; color:var(--dim); }
  .half strong { font:500 28px/1.1 var(--serif); color:var(--paper); }
  .half:hover, .half.hot { border-color:var(--accent-hi); }
  .half.hot { background:color-mix(in srgb, var(--accent) 12%, var(--ink)); }

  @media (max-width:820px) {
    #bar { padding:10px 16px; gap:9px 16px; }
    #drop { padding:16px; }
    #info { margin:0; text-align:left; }
  }
</style>
</head>
<body>
<header id="bar">
  <div class="group">
    <label class="row">Before <select id="selA"></select></label>
    <button id="addA" class="icon" title="Add Before textures" aria-label="Add Before textures">+</button>
    <button id="clrA" class="icon" title="Clear Before" aria-label="Clear Before">×</button>
  </div>
  <div class="group">
    <button data-mode="slider" class="on">Slider</button>
    <button data-mode="diff" title="Bright = changed">Difference</button>
    <label id="gainWrap" class="row" hidden title="Boost small differences">Boost <input id="gain" type="range" min="1" max="50" value="10"></label>
    <button id="fit" title="Fit (or double-click)">Fit</button>
  </div>
  <div class="group">
    <label class="row">After <select id="selB"></select></label>
    <button id="addB" class="icon" title="Add After textures" aria-label="Add After textures">+</button>
    <button id="clrB" class="icon" title="Clear After" aria-label="Clear After">×</button>
  </div>
  <p id="info" role="status"></p>
</header>
<main>
  <canvas id="cv"></canvas>
  <div id="drop">
    <button class="half" data-side="a"><strong>Before</strong><span>drop textures or a folder · UDIMs welcome</span></button>
    <button class="half" data-side="b"><strong>After</strong><span>drop textures or a folder · UDIMs welcome</span></button>
  </div>
</main>
<input type="file" id="fileA" multiple accept="image/*,.exr,.tga,.tif,.tiff" hidden>
<input type="file" id="fileB" multiple accept="image/*,.exr,.tga,.tif,.tiff" hidden>

<script type="module">
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');

// UDIM tile in the name: body_BaseColor.1001.exr, body_1001.png, body-1001.tif
const UDIM = /^(.+?)[._-](1\d{3})\.([a-z0-9]+)$/i;
const OK = /\.(png|jpe?g|webp|gif|bmp|avif|tiff?|exr|tga)$/i;

const SIDES = { a: { sets: new Map(), key: null }, b: { sets: new Map(), key: null } };
const diffs = new Map();   // "idA|idB" -> null while working, then {bmp, changed, max, size}
let mode = 'slider', split = 0.5, view = null, raf = 0, nextId = 1, skipped = 0;

/* ---------- files ---------- */

function addFiles(side, files) {
  const S = SIDES[side];
  for (const f of files) {
    if (f.name.startsWith('.')) continue;
    if (!OK.test(f.name)) { skipped++; continue; }
    const m = f.name.match(UDIM);
    const key = m ? m[1] : f.name.replace(/\.[^.]+$/, '');
    const tile = m ? +m[2] : 1001;
    if (!S.sets.has(key)) S.sets.set(key, new Map());
    S.sets.get(key).set(tile, { id: nextId++, file: f });
  }
  if (!S.sets.has(S.key)) {
    const other = SIDES[side === 'a' ? 'b' : 'a'].key;
    S.key = S.sets.has(other) ? other : [...S.sets.keys()].sort()[0] ?? null;
  }
  changed(true);
}

async function filesFromDrop(dt) {
  const entries = [...dt.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async en => {
    if (en.isFile) out.push(await new Promise((r, j) => en.file(r, j)));
    else if (en.isDirectory) {
      const rd = en.createReader();
      for (let batch; (batch = await new Promise((r, j) => rd.readEntries(r, j))).length;)
        for (const b of batch) await walk(b);
    }
  };
  for (const en of entries) await walk(en);
  return out;
}

/* ---------- decoding ---------- */

const queue = []; let active = 0;
function need(e) {
  return e.p ??= new Promise(res => {
    queue.push(async () => {
      try { e.bmp = await decode(e.file); } catch (err) { e.err = true; console.warn(e.file.name, err); }
      res();
    });
    pump();
  });
}
function pump() {
  while (active < 3 && queue.length) {
    active++;
    queue.shift()().finally(() => { active--; draw(); pump(); });
  }
}

const RAW = { colorSpaceConversion: 'none', premultiplyAlpha: 'none' };
async function decode(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'exr') return exr(file);
  if (ext === 'tga') return tga(file);
  if (ext === 'tif' || ext === 'tiff') {
    try { return await createImageBitmap(file, RAW); } catch { return tiff(file); }  // Safari reads TIFF itself
  }
  return createImageBitmap(file, RAW);
}

// linear float -> sRGB 8-bit
const LUT = new Uint8ClampedArray(16385).map((_, i) => {
  const v = i / 16384;
  return Math.round(255 * (v <= 0.0031308 ? v * 12.92 : 1.055 * v ** (1 / 2.4) - 0.055));
});
const enc = v => LUT[v <= 0 ? 0 : v >= 1 ? 16384 : (v * 16384) | 0];

let threeMods;
async function exr(file) {
  threeMods ??= Promise.all([import('three'), import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/EXRLoader.js')]);
  const [T, { EXRLoader }] = await threeMods;
  const l = new EXRLoader(); l.setDataType(T.FloatType);
  const { width: w, height: h, data } = l.parse(await file.arrayBuffer());
  const ch = data.length / (w * h), img = new ImageData(w, h), O = img.data;
  for (let y = 0; y < h; y++) {
    const src = (h - 1 - y) * w;  // the loader stores rows bottom-up
    for (let x = 0; x < w; x++) {
      const i = (src + x) * ch, o = (y * w + x) * 4;
      if (ch >= 3) { O[o] = enc(data[i]); O[o + 1] = enc(data[i + 1]); O[o + 2] = enc(data[i + 2]); }
      else O[o] = O[o + 1] = O[o + 2] = enc(data[i]);
      O[o + 3] = ch === 4 ? Math.round(Math.min(Math.max(data[i + 3], 0), 1) * 255) : 255;
    }
  }
  return createImageBitmap(img, RAW);
}

let tgaMod;
async function tga(file) {
  tgaMod ??= import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/TGALoader.js');
  const { TGALoader } = await tgaMod;
  const t = new TGALoader().parse(await file.arrayBuffer());
  return createImageBitmap(new ImageData(new Uint8ClampedArray(t.data.buffer, t.data.byteOffset, t.data.length), t.width, t.height), RAW);
}

const script = src => new Promise((r, j) => {
  const s = document.createElement('script'); s.src = src; s.onload = r; s.onerror = j; document.head.append(s);
});
let utif;
async function tiff(file) {
  utif ??= script('https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js')
    .then(() => script('https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js'));
  await utif;
  const buf = await file.arrayBuffer(), ifd = UTIF.decode(buf)[0];
  UTIF.decodeImage(buf, ifd);
  const rgba = UTIF.toRGBA8(ifd);
  return createImageBitmap(new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.length), ifd.width, ifd.height), RAW);
}

/* ---------- differences ---------- */

let diffChain = Promise.resolve();
function queueDiffs() {
  const A = cur('a'), B = cur('b');
  if (!A || !B) return;
  for (const [t, ea] of A) {
    const eb = B.get(t), k = eb && ea.id + '|' + eb.id;
    if (!eb || diffs.has(k)) continue;
    diffs.set(k, null);
    Promise.all([need(ea), need(eb)]).then(() => { diffChain = diffChain.then(() => compare(k, ea, eb)); });
  }
}

async function compare(k, ea, eb) {
  if (!ea.bmp || !eb.bmp) { diffs.set(k, { err: true }); return draw(); }
  const a = ea.bmp, b = eb.bmp;
  const w = Math.max(a.width, b.width), h = Math.max(a.height, b.height);
  const c = new OffscreenCanvas(w, h), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(a, 0, 0, w, h); const A = x.getImageData(0, 0, w, h).data;
  x.clearRect(0, 0, w, h);
  x.drawImage(b, 0, 0, w, h); const B = x.getImageData(0, 0, w, h).data;
  const out = new ImageData(w, h), O = out.data;
  let n = 0, max = 0;
  for (let i = 0; i < A.length; i += 4) {
    const da = Math.abs(A[i + 3] - B[i + 3]);
    const r = Math.max(Math.abs(A[i] - B[i]), da), g = Math.max(Math.abs(A[i + 1] - B[i + 1]), da), bl = Math.max(Math.abs(A[i + 2] - B[i + 2]), da);
    const m = Math.max(r, g, bl);
    if (m) { n++; if (m > max) max = m; }
    O[i] = r; O[i + 1] = g; O[i + 2] = bl; O[i + 3] = 255;
  }
  const size = a.width !== b.width || a.height !== b.height ? `${a.width}→${b.width}` : '';
  diffs.set(k, { bmp: await createImageBitmap(out), changed: n / (w * h), max, size });
  draw();
}

/* ---------- drawing ---------- */

const cur = side => SIDES[side].sets.get(SIDES[side].key);
const rc = t => [(t - 1001) % 10, Math.floor((t - 1001) / 10)];
function tiles() {
  const s = new Set([...(cur('a')?.keys() ?? []), ...(cur('b')?.keys() ?? [])]);
  return [...s].sort((p, q) => p - q);
}

function fit() {
  const T = tiles(); if (!T.length) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  const cs = T.map(t => rc(t)[0]), rs = T.map(t => rc(t)[1]);
  const c0 = Math.min(...cs), c1 = Math.max(...cs) + 1, r0 = Math.min(...rs), r1 = Math.max(...rs);
  const s = Math.min(W / (c1 - c0), H / (r1 - r0 + 1)) * 0.92;
  view = { s, ox: W / 2 - (c0 + c1) / 2 * s, oy: H / 2 - (-r1 + (-r0 + 1)) / 2 * s };
  draw();
}

// canvas colours follow the page's theme (Site settings → Theme), read each time it's drawn
let C;
function colours() {
  const st = getComputedStyle(document.documentElement), v = n => st.getPropertyValue(n).trim();
  C = { ink: v('--ink-rgb'), paper: v('--paper-rgb'), accent: v('--accent'), font: getComputedStyle(document.body).fontFamily };
}

const draw = () => { raf ||= requestAnimationFrame(render); };

function render() {
  raf = 0;
  colours();
  const W = cv.clientWidth, H = cv.clientHeight, d = devicePixelRatio || 1;
  if (cv.width !== Math.round(W * d) || cv.height !== Math.round(H * d)) { cv.width = Math.round(W * d); cv.height = Math.round(H * d); }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const T = tiles();
  status(T);
  if (!T.length) return;
  if (!view) return fit();
  const A = cur('a'), B = cur('b'), sx = split * W, gap = Math.min(4, view.s * 0.01);
  for (const t of T) {
    const [c, r] = rc(t), x = view.ox + c * view.s + gap / 2, y = view.oy - r * view.s + gap / 2, s = view.s - gap;
    if (x > W || y > H || x + s < 0 || y + s < 0) continue;
    ctx.fillStyle = `rgba(${C.paper},.06)`; ctx.fillRect(x, y, s, s);
    const ea = A?.get(t), eb = B?.get(t);
    if (ea) need(ea); if (eb) need(eb);
    const df = ea && eb && diffs.get(ea.id + '|' + eb.id);
    if (mode === 'diff') {
      if (df?.bmp) {
        ctx.imageSmoothingEnabled = s * d < df.bmp.width;
        ctx.filter = `brightness(${$('#gain').value})`;
        ctx.drawImage(df.bmp, x, y, s, s);
        ctx.filter = 'none';
      } else note(x, y, s, !ea || !eb ? (ea ? 'not in After' : 'not in Before') : df?.err ? 'can’t read' : '…');
    } else {
      clipDraw(ea, x, y, s, x, Math.min(x + s, sx), 'not in Before');
      clipDraw(eb, x, y, s, Math.max(x, sx), x + s, 'not in After');
    }
    label(t, df, x, y, s);
  }
  if (mode === 'slider') {
    ctx.fillStyle = `rgb(${C.paper})`; ctx.fillRect(sx - 1, 0, 2, H);
    ctx.beginPath(); ctx.arc(sx, H / 2, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgb(${C.ink})`; ctx.beginPath();
    ctx.moveTo(sx - 9, H / 2); ctx.lineTo(sx - 3, H / 2 - 5); ctx.lineTo(sx - 3, H / 2 + 5);
    ctx.moveTo(sx + 9, H / 2); ctx.lineTo(sx + 3, H / 2 - 5); ctx.lineTo(sx + 3, H / 2 + 5); ctx.fill();
  }
}

function clipDraw(e, x, y, s, l, rgt, missing) {
  if (rgt <= l) return;
  ctx.save(); ctx.beginPath(); ctx.rect(l, y, rgt - l, s); ctx.clip();
  if (e?.bmp) {
    ctx.imageSmoothingEnabled = s * (devicePixelRatio || 1) < e.bmp.width;
    ctx.drawImage(e.bmp, x, y, s, s);
  } else note(x, y, s, !e ? missing : e.err ? 'can’t read' : '…');
  ctx.restore();
}

function note(x, y, s, text) {
  if (s < 60) return;
  ctx.fillStyle = `rgba(${C.paper},.34)`; ctx.font = `13px ${C.font}`; ctx.textAlign = 'center';
  ctx.fillText(text, x + s / 2, y + s / 2); ctx.textAlign = 'left';
}

function label(t, df, x, y, s) {
  if (s < 70) return;
  let text = String(t);
  if (df?.bmp) text += df.changed ? ` · ${(df.changed * 100).toFixed(df.changed < 0.01 ? 2 : 1)}% changed` : ' · identical';
  if (df?.size) text += ` · ${df.size}`;
  ctx.font = `12px ${C.font}`;
  const w = ctx.measureText(text).width + 12;
  ctx.fillStyle = `rgba(${C.ink},.72)`; ctx.fillRect(x + 6, y + s - 26, w, 20);
  ctx.fillStyle = df?.bmp && df.changed ? C.accent : `rgb(${C.paper})`; ctx.fillText(text, x + 12, y + s - 12);
}

function status(T) {
  const A = cur('a'), B = cur('b'), all = [...(A?.values() ?? []), ...(B?.values() ?? [])];
  const loading = all.filter(e => !e.bmp && !e.err).length;
  const pairs = A && B ? T.filter(t => A.has(t) && B.has(t)).map(t => diffs.get(A.get(t).id + '|' + B.get(t).id)) : [];
  const done = pairs.filter(p => p?.bmp), diff = done.filter(p => p.changed).length;
  const bits = [];
  if (T.length) bits.push(`${T.length} tile${T.length > 1 ? 's' : ''}`);
  if (loading) bits.push(`loading ${loading}`);
  else if (pairs.length && done.length < pairs.length) bits.push('comparing…');
  else if (pairs.length) bits.push(diff ? `${diff} changed` : 'no differences');
  if (skipped) bits.push(`${skipped} skipped (not an image)`);
  $('#info').textContent = bits.join(' · ');
}

/* ---------- ui ---------- */

function changed(refit) {
  for (const side of ['a', 'b']) {
    const sel = $(side === 'a' ? '#selA' : '#selB'), S = SIDES[side];
    sel.innerHTML = [...S.sets].sort(([p], [q]) => p.localeCompare(q))
      .map(([k, m]) => `<option>${k.replace(/&/g, '&amp;').replace(/</g, '&lt;')}${m.size > 1 ? ` (${m.size})` : ''}</option>`).join('');
    sel.selectedIndex = [...S.sets.keys()].sort((p, q) => p.localeCompare(q)).indexOf(S.key);
    sel.disabled = S.sets.size < 2;
    sel.hidden = !S.sets.size;
  }
  $('#drop').hidden = !!(SIDES.a.sets.size || SIDES.b.sets.size);
  queueDiffs();
  if (refit) view = null;
  draw();
}

for (const [side, sel] of [['a', '#selA'], ['b', '#selB']]) {
  $(sel).onchange = e => {
    const keys = [...SIDES[side].sets.keys()].sort((p, q) => p.localeCompare(q));
    const k = keys[e.target.selectedIndex];
    SIDES[side].key = k;
    const other = SIDES[side === 'a' ? 'b' : 'a'];
    if (other.sets.has(k)) other.key = k;  // keep the pair on the same map when both sides have it
    changed(true);
  };
}
$('#addA').onclick = () => $('#fileA').click();
$('#addB').onclick = () => $('#fileB').click();
$('#fileA').onchange = e => { addFiles('a', e.target.files); e.target.value = ''; };
$('#fileB').onchange = e => { addFiles('b', e.target.files); e.target.value = ''; };
$('#clrA').onclick = () => { SIDES.a = { sets: new Map(), key: null }; changed(true); };
$('#clrB').onclick = () => { SIDES.b = { sets: new Map(), key: null }; changed(true); };
$('#fit').onclick = fit;
$('#gain').oninput = draw;
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(o => o.classList.toggle('on', o === b));
  $('#gainWrap').hidden = mode !== 'diff';
  draw();
});

// drop on the left half for Before, the right half for After
const halves = document.querySelectorAll('.half');
halves.forEach(h => h.onclick = () => $(h.dataset.side === 'a' ? '#fileA' : '#fileB').click());
const sideAt = x => x < innerWidth / 2 ? 'a' : 'b';
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').hidden = false; });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; changed(); } });
addEventListener('dragover', e => {
  e.preventDefault();
  halves.forEach(h => h.classList.toggle('hot', h.dataset.side === sideAt(e.clientX)));
});
addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0;
  halves.forEach(h => h.classList.remove('hot'));
  const side = sideAt(e.clientX);
  addFiles(side, await filesFromDrop(e.dataTransfer));
});

// drag the line to wipe, drag elsewhere to move, wheel or pinch to zoom
let drag = null, last = null;
cv.onpointerdown = e => {
  if (!view) return;
  cv.setPointerCapture(e.pointerId);
  drag = mode === 'slider' && Math.abs(e.offsetX - split * cv.clientWidth) < 18 ? 'split' : 'pan';
  last = [e.clientX, e.clientY];
};
cv.onpointermove = e => {
  if (!drag) {
    cv.style.cursor = mode === 'slider' && Math.abs(e.offsetX - split * cv.clientWidth) < 18 ? 'ew-resize' : view ? 'grab' : '';
    return;
  }
  if (drag === 'split') split = Math.min(1, Math.max(0, e.offsetX / cv.clientWidth));
  else { view.ox += e.clientX - last[0]; view.oy += e.clientY - last[1]; }
  last = [e.clientX, e.clientY];
  draw();
};
cv.onpointerup = cv.onpointercancel = () => { drag = null; };
cv.addEventListener('wheel', e => {
  if (!view) return;
  e.preventDefault();
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002));
  view.ox = e.offsetX - (e.offsetX - view.ox) * f;
  view.oy = e.offsetY - (e.offsetY - view.oy) * f;
  view.s *= f;
  draw();
}, { passive: false });
cv.ondblclick = fit;
addEventListener('resize', draw);
changed();
</script>
<script type="module">
  // Colours from Site settings → Theme, same as Render Grid
  import { liveFetch } from '../src/utils/liveContent.js';
  import { applyThemeVars } from '../src/utils/themeVars.js';

  const onAccent = hex => {
    const v = parseInt(String(hex).replace('#', ''), 16);
    return 0.299 * (v >> 16) + 0.587 * (v >> 8 & 255) + 0.114 * (v & 255) > 165 ? '#1a1714' : '#fff';
  };
  liveFetch('content.json', '../content.json').then(r => r.json()).then(({ theme }) => {
    applyThemeVars(theme);
    if (theme?.accent) document.documentElement.style.setProperty('--on-accent', onAccent(theme.accent));
    window.dispatchEvent(new Event('resize'));   // redraw the canvas in the new colours
  }).catch(() => {});
</script>
</body>
</html>
