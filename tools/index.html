<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../media/rgr_fav.png">
<link rel="stylesheet" href="../styles-tools.css">
<style>
  #bar { display:flex; gap:9px; align-items:center; padding-top:8px; padding-bottom:8px; overflow-x:auto; }
  #bar a { display:flex; align-items:center; height:32px; padding:0 12px; border:1px solid transparent; border-radius:7px;
           color:var(--dim); text-decoration:none; white-space:nowrap; }
  #bar a:hover { border-color:var(--line); color:var(--paper); }
  #bar a[aria-current] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  main { position:relative; min-height:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--ink); }
</style>
</head>
<body>
<nav id="bar" aria-label="Tools"></nav>
<main id="frames"></main>
<script>
// Each tool is its own page (it also works opened on its own); this page holds them under one set of tabs.
// A tool stays open once visited, so switching back keeps whatever you dropped into it.
// Add the next tool here.
const TOOLS = [
  { id: 'grid', name: 'Render Grid', src: '../grid/' },
  { id: 'textures', name: 'Texture Compare', src: '../textures/' },
];

const bar = document.getElementById('bar'), frames = document.getElementById('frames');
for (const t of TOOLS) {
  const a = document.createElement('a');
  a.href = '#' + t.id;
  a.textContent = t.name;
  bar.append(a);
}

function show() {
  const t = TOOLS.find(t => '#' + t.id === location.hash) || TOOLS[0];
  let f = frames.querySelector(`[data-id="${t.id}"]`);
  if (!f) {
    f = document.createElement('iframe');
    f.dataset.id = t.id;
    f.title = t.name;
    f.src = t.src;
    frames.append(f);
  }
  frames.querySelectorAll('iframe').forEach(o => o.hidden = o !== f);
  bar.querySelectorAll('a').forEach(a => a.toggleAttribute('aria-current', a.hash === '#' + t.id));
  document.title = t.name + ' · Tools';
}
addEventListener('hashchange', show);
show();
</script>
<script type="module" src="../src/utils/toolTheme.js"></script>
</body>
</html>
