<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Screen Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1a1714;--paper:#f2ede4;--accent:#5e30eb;--accent-rgb:94,48,235;
    --font-s:'Cormorant Garamond',serif;--font-b:'DM Sans',sans-serif;
  }
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:var(--font-b);font-weight:300;background:var(--ink);color:var(--paper)}

  #loader{position:fixed;inset:0;z-index:1000;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;opacity:1}
  #loader-img{width:min(120px,25vw);height:auto;margin-bottom:0}
  #loader-name{font-family:var(--font-s);font-size:1.1rem;letter-spacing:.35em;color:var(--paper)}
  #loader-bar-wrap{width:min(300px,70vw);height:1px;background:rgba(242,237,228,0.22);overflow:hidden}
  #loader-bar{height:100%;width:0;background:var(--accent);transition:width 0.3s ease}

  /* Controls */
  #controls{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;gap:1rem;z-index:2000}
  #controls button{
    font-family:var(--font-b);font-size:0.85rem;padding:0.5rem 1.2rem;
    background:rgba(242,237,228,0.1);color:var(--paper);border:1px solid rgba(242,237,228,0.2);
    border-radius:4px;cursor:pointer;transition:background 0.2s
  }
  #controls button:hover{background:rgba(242,237,228,0.2)}
</style>
</head>
<body>

<div id="loader">
  <img id="loader-img" src="images/doog_loop.png" alt="">
  <div id="loader-name">RUN GIRL RUN</div>
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
</div>

<div id="controls">
  <button onclick="simulateLoad()">Simulate Load</button>
  <button onclick="resetLoad()">Reset</button>
</div>

<script>
  let animFrame;
  function simulateLoad() {
    const bar = document.getElementById('loader-bar');
    let progress = 0;
    bar.style.transition = 'none';
    bar.style.width = '0%';
    cancelAnimationFrame(animFrame);

    function step() {
      progress += (100 - progress) * 0.02 + Math.random() * 0.5;
      if (progress > 99.5) progress = 100;
      bar.style.width = progress + '%';
      if (progress < 100) {
        animFrame = requestAnimationFrame(step);
      } else {
        setTimeout(() => {
          document.getElementById('loader').style.transition = 'opacity .55s ease';
          document.getElementById('loader').style.opacity = '0';
        }, 400);
      }
    }
    document.getElementById('loader').style.opacity = '1';
    step();
  }

  function resetLoad() {
    cancelAnimationFrame(animFrame);
    const loader = document.getElementById('loader');
    const bar = document.getElementById('loader-bar');
    loader.style.transition = 'none';
    loader.style.opacity = '1';
    bar.style.transition = 'none';
    bar.style.width = '0%';
  }
</script>
</body>
</html>
